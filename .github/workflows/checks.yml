name: Checks

on: [push, pull_request]

jobs:
  tests:
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install ruff==0.4.10
      - run: ruff check mehteran pipeline tests
      - run: node --test tests/mehteran_markdown_test.mjs
      - run: python -m unittest discover tests
