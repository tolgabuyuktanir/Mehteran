name: I want to help / Yardım etmek istiyorum
description: Propose an improvement of your own. To take an item from ROADMAP.md, write a comment in its issue instead. / Kendi iyileştirmenizi önerin. ROADMAP.md'deki bir maddeyi üstlenmek için o maddenin issue'suna yorum yazın.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. To take a ready item, write a comment in its issue; the items are in [ROADMAP.md](https://github.com/tolgabuyuktanir/Mehteran/blob/main/ROADMAP.md). Questions are always welcome.
        Teşekkürler. Hazır bir maddeyi üstlenmek için onun issue'suna yorum yazın; maddeler [ROADMAP.md](https://github.com/tolgabuyuktanir/Mehteran/blob/main/ROADMAP.md) dosyasında. Sorularınızı her zaman sorabilirsiniz.
  - type: input
    id: item
    attributes:
      label: Your idea in one sentence / Fikriniz tek cümlede
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Your plan or question / Planınız ya da sorunuz
      description: A few lines are enough. / Birkaç satır yeter.
