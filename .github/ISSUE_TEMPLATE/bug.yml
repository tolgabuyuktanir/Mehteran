name: Something does not work / Bir şey çalışmıyor
description: Report a bug. / Bir hata bildirin.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What did you do, and what happened? / Ne yaptınız, ne oldu?
      description: The steps, then what you saw. A screenshot helps. / Adımlar, sonra gördüğünüz. Ekran görüntüsü yardımcı olur.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? / Ne bekliyordunuz?
  - type: input
    id: system
    attributes:
      label: Computer and Mehteran version / Bilgisayar ve Mehteran sürümü
      description: For example "Windows 11, 0.2.0". The version is at the bottom of the page, under "Version". / Örneğin "Windows 11, 0.2.0". Sürüm sayfanın en altında, "Sürüm" başlığı altında.
