# Translation pipeline configuration

# Which AI tool and model does each stage. Write "provider" for the tool's default model, or "provider/model",
# for example "claude/opus" or "gemini/gemini-2.5-pro". Providers are the [providers.*] sections below.
# The web interface (Workflow tab) edits this section: steps can be added, removed and reordered there.
[stages]
# The nodes after the first translation, in order: review<n> (findings), revise<n>/reconcile/apply<n> (applies
# them), source_check[<n>], custom<n> and gate<n> (checkpoint). Each node works on the latest text.
flow         = ["review1", "revise1", "source_check", "review2", "reconcile", "apply2"]
align        = "gemini"                 # preparation: finds each Turkish segment in the reference translations
glossary     = "claude"                 # preparation: extracts the terminology glossary
translate    = "chatgpt"                # first translation
review1      = ["gemini"]               # reviewers report findings (in parallel); the text is unchanged
revise1      = "chatgpt"                # applies the findings reported since the last text
source_check = "claude"                 # checks the text against the Turkish source from the start, and corrects it
review2      = ["chatgpt", "gemini"]    # reviewers report findings (in parallel); the text is unchanged
reconcile    = "claude"                 # applies the findings reported since the last text
apply2       = "claude"                 # applies the findings reported since the last text

[nodes]
# Options of custom steps (title, mode: report or rewrite) and checkpoints (back_to, max).

[general]
language     = "tr"     # interface language when none is given: "tr" or "en"
segment_size = 6000     # approximate characters per segment (applies only when a book is first prepared)
parallel     = 3        # number of requests that run at the same time
timeout      = 1200     # maximum duration of one request, in seconds
retries      = 3        # total attempts on an error or an empty answer
quota_wait_minutes = 30 # when a tool reports a usage limit without a reset time, wait this long and try again
quota_max_hours    = 24 # give up after waiting this long for a usage limit in one call
keep_awake   = true     # keep the computer awake while a translation runs (macOS, Windows, Linux with systemd)

[export]
# Layout of an exported book (Word, PDF, HTML). A Word template decides the Word layout instead.
page_size        = "A4"  # A4, A5, B5, 13.5x21, 16x24 or Letter
margin_top       = 2.5  # margins in cm
margin_bottom    = 2.5
margin_side      = 2.5
font             = ""  # body font; "" = automatic
arabic_font      = ""  # font of Arabic passages; "" = automatic
font_size        = 12.0  # in points
line_spacing     = 1.15  # 1.0 = single line spacing
justify          = true  # justified paragraphs
chapter_new_page = true  # each top-level chapter starts on a new page
word_template    = ""  # the original name of export/word-template.docx; "" = no template

# Each command reads the prompt from stdin and writes the answer to stdout.
#   model        : default model of the provider; if empty, the tool's own default is used. "--model <value>" is added.
#   models       : model names offered in the Workflow tab (edited there).
#   {output}     : if the command contains it, the answer is read from this file instead of stdout.
#   json_field   : if set, stdout is parsed as JSON and this field is the answer.
#   install_hint : shown by './translate setup' when the tool is missing.

[providers.claude]
models = []
command = [
  "claude", "-p", "--safe-mode", "--tools", "", "--no-session-persistence", "--output-format", "text",
  "--system-prompt", "You are a meticulous professional translator and editor of Islamic religious books. Follow the instructions in the user message exactly and output only what is requested.",
]
model = ""
install_hint = "https://claude.com/claude-code  (then sign in: claude auth login)"

[providers.gemini]
models = []
command = ["gemini", "-p", "Follow the instructions given above exactly.", "-o", "json", "--skip-trust"]
json_field = "response"
model = ""
install_hint = "npm install -g @google/gemini-cli  (then sign in: gemini)"

[providers.chatgpt]
models = []
command = ["codex", "exec", "--skip-git-repo-check", "--sandbox", "read-only", "--ephemeral", "--color", "never", "-o", "{output}"]
model = ""
install_hint = "npm install -g @openai/codex  (then sign in: codex login)"

