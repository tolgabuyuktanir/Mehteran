<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translation Desk</title>
<link rel="stylesheet" href="/style.css">
<script>window.TOKEN = "__TOKEN__";</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark">ت</span>
    <div>
      <h1 data-i18n="app_title"></h1>
      <p data-i18n="app_subtitle"></p>
    </div>
  </div>
  <div class="top-right">
    <nav class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" aria-controls="setup" data-tab="setup" data-i18n="tab_setup"></button>
      <button type="button" class="tab" role="tab" aria-controls="books" data-tab="books" data-i18n="tab_books"></button>
      <span class="tab-sep" aria-hidden="true"></span>
      <button type="button" class="tab quiet" role="tab" aria-controls="workflow" data-tab="workflow" data-i18n="tab_workflow"></button>
      <button type="button" class="tab quiet" role="tab" aria-controls="prompts" data-tab="prompts" data-i18n="tab_prompts"></button>
    </nav>
    <div class="lang-switch" role="group" aria-label="Language / Dil">
      <button type="button" data-ui-lang="tr">TR</button>
      <button type="button" data-ui-lang="en">EN</button>
    </div>
  </div>
</header>

<main>
  <!-- SETUP -->
  <section id="setup" class="panel" role="tabpanel" hidden>
    <div class="panel-head">
      <div>
        <h2 data-i18n="setup_title"></h2>
        <p class="muted" data-i18n="setup_intro"></p>
      </div>
      <button type="button" class="btn" id="tools-refresh" data-i18n="refresh_status"></button>
    </div>
    <section class="card box onboarding" id="onboarding"></section>
    <div id="tools" class="tool-grid"></div>

    <details class="sub flow-box">
      <summary data-i18n="flow_title"></summary>
      <div id="flow" class="flow"></div>
      <button type="button" class="btn small" data-goto="workflow" data-i18n="edit_workflow"></button>
    </details>
  </section>

  <!-- WORKFLOW -->
  <section id="workflow" class="panel" role="tabpanel" hidden>
    <div class="panel-head">
      <div>
        <h2 data-i18n="workflow_title"></h2>
        <p class="muted" data-i18n="workflow_intro"></p>
      </div>
      <div class="row">
        <span id="board-status" class="muted small" role="status" aria-live="polite"></span>
        <button type="button" class="btn" id="board-preset" data-i18n="preset"></button>
      </div>
    </div>
    <div class="board">
      <aside class="palette" id="palette"></aside>
      <div class="board-main">
        <div class="canvas" id="canvas" role="group"></div>
        <div id="board-warnings"></div>
        <section class="card inspector" id="inspector" aria-live="polite"></section>
      </div>
    </div>
  </section>

  <!-- BOOKS -->
  <section id="books" class="panel" role="tabpanel" hidden>
    <div class="notice warn banner" id="setup-banner" hidden>
      <span data-i18n="setup_banner"></span>
      <button type="button" class="btn small" data-goto="setup" data-i18n="go_setup"></button>
    </div>
    <div class="books">
      <aside class="book-list">
        <h2 data-i18n="tab_books"></h2>
        <ul id="book-list"></ul>
        <form id="new-book" class="stack">
          <label for="new-book-name" data-i18n="new_book"></label>
          <div class="row">
            <input id="new-book-name" data-i18n-placeholder="new_book_placeholder" required>
            <button type="submit" class="btn primary" data-i18n="add"></button>
          </div>
        </form>
      </aside>
      <div id="book" class="book-detail"></div>
    </div>
  </section>

  <!-- PROMPTS -->
  <section id="prompts" class="panel" role="tabpanel" hidden>
    <div class="panel-head">
      <div>
        <h2 data-i18n="tab_prompts"></h2>
        <p class="muted" data-i18n="prompts_intro"></p>
      </div>
    </div>
    <div class="prompts">
      <ul id="prompt-list" class="prompt-list"></ul>
      <div id="prompt" class="prompt-editor"></div>
    </div>
  </section>
</main>

<dialog id="reader" aria-labelledby="reader-title">
  <div class="dialog-head">
    <h3 id="reader-title"></h3>
    <div class="row">
      <a id="reader-download" class="btn" href="#" data-i18n="download"></a>
      <button type="button" class="btn" id="reader-close" data-i18n="close"></button>
    </div>
  </div>
  <pre id="reader-text" class="reader"></pre>
</dialog>

<dialog id="layout" aria-labelledby="layout-title">
  <form method="dialog" id="layout-form">
    <div class="dialog-head">
      <h3 id="layout-title" data-i18n="layout_title"></h3>
      <button type="button" class="btn" data-act="layout-close" data-i18n="close"></button>
    </div>
    <div class="layout-body">
      <p class="muted small" data-i18n="layout_intro"></p>
      <section class="layout-part">
        <h4 data-i18n="layout_template"></h4>
        <p class="small" data-role="template-state"></p>
        <div class="row">
          <input type="file" id="layout-template" accept=".docx,.dotx" aria-labelledby="layout-template-label">
          <span id="layout-template-label" hidden data-i18n="layout_template"></span>
          <button type="button" class="btn small" data-act="template-upload" data-i18n="upload"></button>
          <button type="button" class="btn small danger" data-act="template-remove" data-i18n="layout_template_remove"></button>
        </div>
      </section>
      <section class="layout-part">
        <h4 data-i18n="layout_settings"></h4>
        <p class="muted small" data-role="layout-scope"></p>
        <div class="layout-grid">
          <div class="stack"><label for="layout-page_size" data-i18n="layout_page_size"></label><select id="layout-page_size" name="page_size"></select></div>
          <div class="stack"><label for="layout-font_size" data-i18n="layout_font_size"></label><input id="layout-font_size" name="font_size" type="number" min="8" max="16" step="0.5" required></div>
          <div class="stack"><label for="layout-line_spacing" data-i18n="layout_line_spacing"></label><input id="layout-line_spacing" name="line_spacing" type="number" min="1" max="3" step="0.05" required></div>
          <div class="stack"><label for="layout-margin_top" data-i18n="layout_margin_top"></label><input id="layout-margin_top" name="margin_top" type="number" min="0.5" max="5" step="0.1" required></div>
          <div class="stack"><label for="layout-margin_bottom" data-i18n="layout_margin_bottom"></label><input id="layout-margin_bottom" name="margin_bottom" type="number" min="0.5" max="5" step="0.1" required></div>
          <div class="stack"><label for="layout-margin_side" data-i18n="layout_margin_side"></label><input id="layout-margin_side" name="margin_side" type="number" min="0.5" max="5" step="0.1" required></div>
          <div class="stack"><label for="layout-font" data-i18n="layout_font"></label><input id="layout-font" name="font" maxlength="60" data-i18n-placeholder="layout_automatic"></div>
          <div class="stack"><label for="layout-arabic_font" data-i18n="layout_arabic_font"></label><input id="layout-arabic_font" name="arabic_font" maxlength="60" data-i18n-placeholder="layout_automatic"></div>
        </div>
        <label class="check"><input type="checkbox" name="justify"> <span data-i18n="layout_justify"></span></label>
        <label class="check"><input type="checkbox" name="chapter_new_page"> <span data-i18n="layout_chapter_new_page"></span></label>
        <p class="muted small" data-i18n="layout_fonts_note"></p>
      </section>
    </div>
    <div class="dialog-foot row">
      <button type="button" class="btn" data-act="layout-defaults" data-i18n="layout_defaults"></button>
      <button type="submit" class="btn primary" data-i18n="save"></button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>
<script src="/app.js"></script>
</body>
</html>
