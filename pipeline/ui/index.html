<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translation Desk</title>
<link rel="stylesheet" href="/style.css">
<script>window.TOKEN = "__TOKEN__";</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark">ت</span>
    <div>
      <h1 data-i18n="app_title"></h1>
      <p data-i18n="app_subtitle"></p>
    </div>
  </div>
  <div class="top-right">
    <nav class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" aria-controls="tr-setup" data-tab="setup" data-i18n="tab_setup"></button>
      <button type="button" class="tab" role="tab" aria-controls="tr-books" data-tab="books" data-i18n="tab_books"></button>
      <span class="tab-sep" aria-hidden="true"></span>
      <button type="button" class="tab quiet" role="tab" aria-controls="tr-workflow" data-tab="workflow" data-i18n="tab_workflow"></button>
      <button type="button" class="tab quiet" role="tab" aria-controls="tr-prompts" data-tab="prompts" data-i18n="tab_prompts"></button>
    </nav>
    <div class="lang-switch" role="group" aria-label="Language / Dil">
      <button type="button" data-ui-lang="tr">TR</button>
      <button type="button" data-ui-lang="en">EN</button>
    </div>
  </div>
</header>

<!-- The panels and dialogs are drawn by app.js (TranslationUI.mount); Mehteran mounts the same file in its page. -->
<main data-translation-app></main>

<script src="/app.js"></script>
</body>
</html>
