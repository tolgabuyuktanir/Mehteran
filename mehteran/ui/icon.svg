    <path d="M28.1 31.5c2.7-1.1 5.5-1.2 8.2-.1"/>
    <circle cx="35.4" cy="44.3" r="7.6"/>
    <path d="M31.4 41.2c2.3-2 5.6-2.1 8-.2M31.3 47.3c2.4 2.1 5.7 2.1 8.2.1" stroke-width="1.4"/>
