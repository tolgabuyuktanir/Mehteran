    <path d="M13.2 27.4c.3-3.2 1.4-5.7 3.2-5.8 1.9 0 3 2.5 3.3 5.7"/>
    <path d="M13 27.6c2.3.5 4.6.5 6.9-.1"/>
    <circle cx="16.4" cy="31.2" r="3.1"/>
