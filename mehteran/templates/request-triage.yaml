# Built-in template (read-only). To change it, use "Customize": that makes your own copy under a new id.
schema_version: 1
id: request-triage
name:
  tr: Talep ve şikâyet önceliklendirme
  en: Request and complaint triage
description:
  tr: >-
    Gelen bir müşteri talebini ya da şikâyetini değerlendirir ve iki yoldan birini seçer. Bir model önce talebin
    acil olup olmadığına (güvenlik, hukuki risk, büyük maddi zarar, açık bir öfke) evet ya da hayır diye karar
    verir ve gerekçesini yazar. Acilse yöneticiye bir yükseltme notu ve müşteriye bir ilk cevap taslağı yazılır;
    değilse standart bir cevap taslağı yazılır. Seçilmeyen yol hiç çalışmaz. Sonuç Markdown, Word ve HTML
    rapordur.
  en: >-
    Assesses an incoming customer request or complaint and takes one of two paths. A model first decides yes or
    no whether the request is urgent (safety, legal risk, major financial harm, open anger) and gives its
    reasons. If it is urgent, an escalation note for a manager and a first reply to the customer are drafted;
    otherwise a standard reply is drafted. The path not taken never runs. The result is a Markdown, Word and HTML
    report.
version: "1.0"
category: business

inputs:
  - id: message
    type: text
    multiline: true
    label: {tr: Talep ya da şikâyet metni, en: Text of the request or complaint}
  - id: company_context
    type: text
    multiline: true
    required: false
    default: ""
    label: {tr: Şirket bilgisi, en: Company context}
    description:
      tr: "Örnek: ürün, iade politikası, cevap tonu. Boş bırakılabilir."
      en: "For example: the product, the return policy, the tone of replies. May be left empty."
  - id: language
    type: language
    label: {tr: Rapor dili, en: Report language}
  - id: model
    type: provider
    label: {tr: Model, en: Model}
    default: auto

nodes:
  - id: assess
    type: ai.cli
    label: {tr: Aciliyet, en: Urgency}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Decide whether the customer message below is urgent. Urgent means at least one of: a risk to someone's
        safety or health, a legal threat or a likely legal problem, a major financial loss for the customer or the
        company, a data or privacy incident, or a customer who is openly angry and about to leave.

        The message:

        {{inputs.message}}

        Answer format: the first word of your answer is exactly "yes" or "no" (in English, lower case, without
        any formatting), then a new line, then two to four sentences with the reasons, written in
        the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Judge only from the message; do not assume facts it does
        not state.

  - id: gate
    type: condition
    label: {tr: Acilse, en: If urgent}
    config:
      value: "{{nodes.assess.text}}"
      operator: is_yes

  - id: escalate
    type: ai.cli
    label: {tr: Yükseltme notu ve ilk cevap, en: Escalation note and first reply}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: A customer message was judged urgent. Write two texts in the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text).

        The message:

        {{inputs.message}}

        Why it was judged urgent:

        {{nodes.gate.true}}

        Company context (it may be empty): {{inputs.company_context}}

        1. An escalation note for a manager: what happened, why it is urgent, what is at risk, the decisions
           needed now. At most 150 words.
        2. A first reply to the customer: acknowledge the problem, say what happens next and by when, and do not
           admit legal liability or promise anything that the company context does not allow. Do not invent reasons,
           excuses, promises or conditions, and do not mention today's date or the year.

        Format: Markdown. Put an empty line before and after every heading. Start directly with these headings
        (translated into the output language):

        # Urgent request

        ## Escalation note

        ## First reply to the customer

  - id: reply
    type: ai.cli
    label: {tr: Standart cevap, en: Standard reply}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: A customer message was judged not urgent. Draft a friendly, clear reply in the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text).

        The message:

        {{inputs.message}}

        The assessment:

        {{nodes.gate.false}}

        Company context (it may be empty): {{inputs.company_context}}

        Answer each question of the customer. Where the company context does not give the answer, write a
        placeholder in square brackets for the person who sends the reply, instead of inventing facts. Do not invent
        reasons, excuses, promises or conditions, and do not mention today's date or the year.

        Format: Markdown. Put an empty line before and after every heading. Start directly with these headings
        (translated into the output language):

        # Request

        ## Assessment
        (one sentence)

        ## Reply to the customer

  - id: report
    type: text.merge
    label: {tr: Raporu birleştir, en: Assemble report}
    config:
      template: |
        {{nodes.escalate.text}}{{nodes.reply.text}}

  - id: export
    type: document.export
    label: {tr: Raporu kaydet, en: Save report}
    config:
      source: "{{nodes.report.text}}"
      title: Triage
      lang: "{{inputs.language}}"
      formats: [md, docx, html]
      filename: triage

connections:
  - {from: assess.text, to: gate}
  - {from: gate.true, to: escalate}
  - {from: gate.false, to: reply}
  - {from: escalate.text, to: report}
  - {from: reply.text, to: report}
  - {from: report.text, to: export}

outputs:
  - {id: report_md, from: export.md, label: {tr: Rapor (Markdown), en: Report (Markdown)}}
  - {id: report_docx, from: export.docx, label: {tr: Rapor (Word), en: Report (Word)}}
  - {id: report_html, from: export.html, label: {tr: Rapor (HTML), en: Report (HTML)}}
