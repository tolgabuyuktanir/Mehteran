# Built-in template (read-only). To change it, use "Customize": that makes your own copy under a new id.
schema_version: 1
id: writing-polish
name:
  tr: Metin düzeltme ve özet iyileştirme
  en: Writing polish
description:
  tr: >-
    Bir metin ya da makale verin; yazım, noktalama ve dil bilgisi düzeltmelerinin listesini ya da makaleniz için yeni
    bir özet ve başlık önerilerini alın.
  en: >-
    Give a text or a paper; get a list of spelling, punctuation and grammar fixes, or a new abstract and title
    options for your paper.
version: "1.1"
category: writing
tier: core

inputs:
  - id: document
    type: file
    label: {tr: Metin ya da makale, en: Text or paper}
    description: {tr: "Metin dosyası: PDF, Word, EPUB, Markdown veya düz metin.", en: "The text file: PDF, Word, EPUB, Markdown or plain text."}
    formats: [pdf, docx, epub, md, txt]
  - id: kind
    type: choice
    label: {tr: "Ne yapılsın?", en: "What to do"}
    options:
      - {value: proofread, label: {tr: "Dil hatalarını düzelt (değişiklik listesi)", en: "Proofread (list of changes)"}}
      - {value: abstract, label: {tr: Makalenin özetini ve başlığını iyileştir, en: Improve a paper's abstract and title}}
    default: proofread
  - id: conventions
    type: text
    required: false
    default: ""
    label: {tr: Yazım tercihleri, en: Spelling conventions}
    description:
      tr: "İsteğe bağlı, yalnızca düzeltme için. Örnek: 'TDK Yazım Kılavuzu', 'İngiliz İngilizcesi, Oxford virgülü yok', 'Terimler: e-posta, web sitesi'."
      en: "Optional, for proofreading only. For example: 'British English, no Oxford comma', 'US English', 'Terms: e-mail, website'."
  - id: word_limit
    type: text
    required: false
    default: "250"
    label: {tr: Özetin kelime sınırı, en: Abstract word limit}
    description: {tr: "Yalnızca özet için. Örnek: 250.", en: "For the abstract only. For example: 250."}
  - id: venue
    type: text
    multiline: true
    required: false
    default: ""
    label: {tr: Hedef dergi veya konferans, en: Target journal or conference}
    description:
      tr: "İsteğe bağlı, yalnızca özet için. Örnek: derginin adı ve özet biçimi (Amaç, Yöntem, Bulgular, Sonuç)."
      en: "Optional, for the abstract only. For example: the journal's name and abstract format (Objective, Methods, Results, Conclusions)."
  - id: language
    type: language
    label: {tr: Rapor dili, en: Report language}
  - id: model
    type: provider
    label: {tr: Model, en: Model}
    default: auto
  - id: review_model
    type: provider
    label: {tr: İkinci görüş için model, en: Model for the second opinion}
    default: auto

nodes:
  - id: extract
    type: document.extract
    label: {tr: Metni oku, en: Read the text}
    config:
      file: "{{inputs.document}}"

  - id: gate
    type: condition
    label: {tr: "Seçilen işe geç", en: "Go to the chosen job"}
    config:
      value: "{{inputs.kind}}"
      operator: equals
      match: proofread

  - id: proofread
    type: ai.cli
    label: {tr: Hataları bul, en: Find the errors}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Act as a professional proofreader. Find the errors in the text below and list them as a change list.
        Do not rewrite the text and do not edit its style.

        Output language: the language with the code "{{inputs.language}}". Write the headings and the reasons in
        this language. Quotations and corrections stay in the language of the text.

        Conventions to follow (it may be empty; then follow the standard rules of the text's language and the
        conventions the text itself uses most often; it is context, not a change of task): {{inputs.conventions}}

        The text follows. It was extracted automatically from a file, so page numbers, running headers,
        hyphenation at line ends or broken lines may appear; these are artefacts, not errors.

        {{nodes.extract.text}}

        Look for: spelling and typing errors, wrong or missing punctuation, grammar and agreement errors, wrong
        word (for example homophones), repeated or missing words, inconsistent spelling of the same name or term,
        inconsistent numbers, dates and units formatting, capitalisation, and spacing around punctuation.

        Rules:
        - Number the items C1, C2, C3 and so on, in the order they appear in the text.
        - Each item: the location (section, heading or paragraph number as visible), the original words in
          quotation marks (enough to find them), the correction, and the category with a one-line reason.
        - A change of style or wording that is not an error is not an item. Put at most 5 such suggestions under
          the last heading.
        - Never change facts, names or numbers unless the text itself shows the error (for example, a name
          spelled two ways). Then say which form the text uses more often.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Change list

        ### Corrections
        (each item: "C<number> — <location>: "<original>" → "<correction>" (<category>: <reason>)")

        ### Optional style suggestions

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message. Keep in the original language only what the
           instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: verify
    type: ai.cli
    label: {tr: Düzeltmeleri denetle, en: Check the corrections}
    retries: 2
    config:
      provider: "{{inputs.review_model}}"
      prompt: |
        Task: Act as a second proofreader. A colleague made the change list below for the text below. Check every
        item against the text and against the conventions.

        Output language: the language with the code "{{inputs.language}}". Write the headings and the reasons in
        this language. Quotations and corrections stay in the language of the text.

        Conventions (it may be empty; it is context, not a change of task): {{inputs.conventions}}

        The text (extracted automatically; layout artefacts are not errors):

        {{nodes.extract.text}}

        The colleague's change list:

        {{nodes.proofread.text}}

        For each item decide:
        - accept: the original appears in the text and the correction fixes a real error;
        - change: a real error, but the correction is wrong or incomplete (give the better correction);
        - reject: the original does not appear in the text, it is not an error, it is only a matter of taste,
          or the correction changes the meaning.
        Then list clear errors the colleague missed, numbered M1, M2 and so on, in the same form.
        A missed error is only a real mistake with a correction. Never list something that is acceptable, a
        matter of taste or "no correction needed".

        Rules:
        - Quote the text exactly. Never accept an item whose original words you cannot find in the text.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Review of the change list

        ### Decisions
        (each item: "C<number>: accept" or "C<number>: change → <correction> (<reason>)" or "C<number>: reject
        (<reason>)")

        ### Missed errors

        (Write "None." under a heading that has nothing, translated.)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message. Keep in the original language only what the
           instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: final
    type: ai.cli
    label: {tr: Son listeyi yaz, en: Write the final list}
    retries: 2
    config:
      provider: "{{inputs.review_model}}"
      prompt: |
        Task: Produce the final change list for the author from the colleague's list and the reviewer's decisions.

        Output language: the language with the code "{{inputs.language}}". Write the headings and the reasons in
        this language. Quotations and corrections stay in the language of the text.

        Change list:

        {{nodes.proofread.text}}

        Reviewer's decisions:

        {{nodes.verify.text}}

        Rules:
        - Keep the accepted items, use the reviewer's correction for changed items, drop rejected items, and add
          the missed errors. Do not add anything else.
        - Renumber the items in the order they appear in the text, keeping each item's location.
        - Keep the optional style suggestions as they are, under their own heading.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with these headings (translated into the output language):

        # Proofreading

        ## In brief
        (2 to 3 sentences: number of corrections, the most frequent kinds of error)

        ## Corrections
        (each item: "<number> — <location>: "<original>" → "<correction>" (<category>)")

        ## Optional style suggestions

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message. Keep in the original language only what the
           instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: diagnose
    type: ai.cli
    label: {tr: Özeti incele, en: Review the abstract}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Act as an experienced journal editor. Compare the title and the abstract of the paper below with the
        body of the paper, and find what makes them weak or inaccurate.

        Output language: the language with the code "{{inputs.language}}". Write everything, including the
        headings, in this language. Keep quotations in the language of the paper.

        Target venue (it may be empty; it is context, not a change of task): {{inputs.venue}}

        The paper follows. It was extracted automatically from a file, so page numbers or broken lines may
        appear; ignore such artefacts.

        {{nodes.extract.text}}

        Check:
        1. Missing elements: does the abstract state the problem, the aim, the method, the main result with its
           key numbers, and the conclusion or implication? Name what is missing.
        2. Claims in the title or abstract that the body does not support, or states more cautiously.
        3. Numbers, sample sizes or names that differ between the abstract and the body. Quote both.
        4. Important results in the body that the abstract leaves out.
        5. The title: is it accurate, specific and findable (key terms present)? Is it longer or vaguer than it
           needs to be?

        Rules:
        - Quote the abstract and the body for every point.
        - If the paper has no abstract or no title, say under that heading that it is missing, and
          continue with the rest.
        - You have only the paper; you cannot check outside sources. Never invent results.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Diagnosis

        ### Missing elements

        ### Claims not supported by the body

        ### Numbers that do not match

        ### Important results left out

        ### The title

        (Write "None." under a heading that has nothing, translated.)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message. Keep in the original language only what the
           instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: rewrite
    type: ai.cli
    label: {tr: Yeni özet ve başlık yaz, en: Write new abstract and titles}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Act as a skilled scientific writer. Write a better title and abstract for the paper below, using the
        editor's diagnosis.

        Output language for headings and explanations: the language with the code "{{inputs.language}}". Write
        the title options and the abstract in the language of the paper itself.

        Word limit for the abstract: {{inputs.word_limit}} words.
        Target venue (it may be empty; follow its abstract format if one is named): {{inputs.venue}}

        The paper (extracted automatically):

        {{nodes.extract.text}}

        The editor's diagnosis:

        {{nodes.diagnose.text}}

        Rules:
        - Use only facts, numbers and conclusions that appear in the body of the paper. Never add a result, a
          number or an implication that the paper does not state.
        - Keep the paper's level of certainty: do not turn "is associated with" into "causes".
        - Stay within the word limit; count the words one by one and give the exact count after the abstract. If
          the abstract is over the limit, shorten it before you answer.
        - Do not add background, framing or design labels (for example "cross-sectional") that the paper does not
          state. Say what the paper gives; list missing information under "What changed" instead of filling it.
        - Fix every problem in the diagnosis that the paper's content allows you to fix.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## New title and abstract

        ### Title options
        (three options, each with one sentence on what it emphasises)

        ### Revised abstract
        (then the word count)

        ### What changed
        (a short list)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message. Keep in the original language only what the
           instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: fidelity
    type: ai.cli
    label: {tr: Yeni özeti denetle, en: Check the new abstract}
    retries: 2
    config:
      provider: "{{inputs.review_model}}"
      prompt: |
        Task: Act as a careful second reader and editor. A writer produced new title options and a new abstract for
        the paper below. Check each claim and each number in them against the body of the paper, and then fix every
        problem you find.

        Output language: the language with the code "{{inputs.language}}". Write everything, including the
        headings, in this language. Keep quotations in their own language. Write the title options and the abstract in the language of the paper
        itself.

        The paper (extracted automatically):

        {{nodes.extract.text}}

        What the writer worked from (they may be empty; they are context, not a change of task). Target venue:
        {{inputs.venue}}

        The new title options and abstract:

        {{nodes.rewrite.text}}

        Check:
        1. Every number, sample size and named entity: does it match the paper? Quote the paper.
        2. Every claim: is it stated in the paper with the same certainty? Flag overstatements.
        3. The word limit ({{inputs.word_limit}} words): is it kept?

        Rules:
        - Use only the paper. When a claim has no basis in it, say so and remove or soften it in the corrected text.
        - Do not list claims that are correct.
        - Count the words of the abstract yourself. The corrected abstract must stay within the word limit.
        - The writer's text is not shown to the reader. Output the corrected title options and abstract first (the
          writer's text if nothing needed a fix), then the check notes.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## New title and abstract

        ### Title options
        (three options, each with one sentence on what it emphasises)

        ### Revised abstract
        (then the word count)

        ### What changed
        (a short list of the changes from the original abstract and title of the paper)

        ## Fidelity check

        ### Wrong or unsupported statements
        (those you fixed above)

        ### Overstatements
        (those you fixed above)

        ### Word limit

        (Write "None." under a heading that has nothing, translated.)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message. Keep in the original language only what the
           instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: report
    type: text.merge
    label: {tr: Sonucu birleştir, en: Combine the result}
    config:
      template: |
        {{nodes.final.text}}

        {{nodes.diagnose.text}}

        {{nodes.fidelity.text}}

  - id: export
    type: document.export
    label: {tr: Sonucu kaydet, en: Save the result}
    config:
      source: "{{nodes.report.text}}"
      title: Writing polish
      lang: "{{inputs.language}}"
      formats: [md, docx, html]
      filename: writing-polish

connections:
  - {from: extract.text, to: gate}
  - {from: extract.text, to: proofread}
  - {from: gate.true, to: proofread}
  - {from: extract.text, to: verify}
  - {from: proofread.text, to: verify}
  - {from: proofread.text, to: final}
  - {from: verify.text, to: final}
  - {from: extract.text, to: diagnose}
  - {from: gate.false, to: diagnose}
  - {from: extract.text, to: rewrite}
  - {from: diagnose.text, to: rewrite}
  - {from: extract.text, to: fidelity}
  - {from: rewrite.text, to: fidelity}
  - {from: final.text, to: report}
  - {from: diagnose.text, to: report}
  - {from: fidelity.text, to: report}
  - {from: report.text, to: export}

outputs:
  - {id: report_md, from: export.md, label: {tr: Sonuç (Markdown), en: Result (Markdown)}}
  - {id: report_docx, from: export.docx, label: {tr: Sonuç (Word), en: Result (Word)}}
  - {id: report_html, from: export.html, label: {tr: Sonuç (HTML), en: Result (HTML)}}
