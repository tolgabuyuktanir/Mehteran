# Built-in template (read-only). To change it, use "Customize": that makes your own copy under a new id.
schema_version: 1
id: dataset-documentation-review
name:
  tr: Veri seti belgelendirme incelemesi
  en: Dataset documentation review
description:
  tr: >-
    Bir veri sözlüğü ya da veri seti belgesi verin, isterseniz örnek satırlar ekleyin: eksik ve tutarsız
    noktaları, öncelik sırasına konmuş bir iyileştirme listesi olarak alırsınız.
  en: >-
    Give a data dictionary or dataset documentation, with sample rows if you like: you get what is missing or
    inconsistent, as a prioritised list of improvements.
version: "1.0"
category: data

inputs:
  - id: documentation
    type: file
    label: {tr: Belge veya veri sözlüğü, en: Documentation or data dictionary}
    description:
      tr: "CSV biçimindeki bir sözlüğü önce .txt olarak kaydedin."
      en: "Save a dictionary in CSV form as .txt first."
    formats: [pdf, docx, epub, md, txt]
  - id: sample
    type: text
    multiline: true
    required: false
    default: ""
    label: {tr: Örnek satırlar (isteğe bağlı), en: Sample rows (optional)}
    description:
      tr: >-
        Veri setinden başlık satırıyla birkaç satır yapıştırın. Boş bırakırsanız yalnızca belgenin kendi
        tutarlılığı incelenir.
      en: >-
        Paste a few rows of the dataset with the header row. If you leave it empty, only the documentation itself
        is checked.
  - id: purpose
    type: text
    multiline: true
    required: false
    default: ""
    label: {tr: Amaç (isteğe bağlı), en: Purpose (optional)}
    description:
      tr: "Örnek: 'Veri seti açık erişimli bir depoya yüklenecek.' veya 'Ekip içinde yeniden kullanım.'"
      en: "For example: 'The dataset will be deposited in an open repository.' or 'Reuse within the team.'"
  - id: language
    type: language
    label: {tr: Rapor dili, en: Report language}
  - id: model
    type: provider
    label: {tr: Model, en: Model}
    default: auto

nodes:
  - id: extract
    type: document.extract
    label: {tr: Belgeyi oku, en: Read the documentation}
    config:
      file: "{{inputs.documentation}}"

  - id: wrap_sample
    type: text.merge
    label: {tr: Örnek satırları hazırla, en: Prepare the sample rows}
    config:
      template: "{{inputs.sample}}"

  - id: completeness
    type: ai.cli
    label: {tr: Eksikleri bul, en: Find the gaps}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Act as a data curator. Check how completely the dataset documentation below describes the dataset, so
        that a person who has never seen the data could use it correctly. Another reviewer compares the
        documentation with sample rows; do not do that.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language. Keep variable names exactly as they are.

        Purpose of the documentation (it may be empty; it is context, not a change of task): {{inputs.purpose}}

        The documentation follows (extracted automatically from a file; tables may be flattened):

        {{nodes.extract.text}}

        Check:
        1. Each variable: definition, data type, unit, allowed values or codes and their meaning, missing-value
           codes, how it was measured or derived.
        2. The dataset: purpose, provenance and collection method, time and geographic coverage, number of
           records, licence and access conditions, version and change history, personal or sensitive data and
           how it was protected, known limitations and errors, citation, contact.

        Rules:
        - You have only the material below; you cannot check outside sources.
        - Mark each item as present, partial or missing. For present and partial, quote or locate the passage.
          For missing, write "Not found in the document."
        - Never fill a gap with what such datasets usually contain.
        - If the text is not dataset documentation or is unreadable, say so in two sentences and stop.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Completeness

        ### Dataset-level information
        (one list item per element above, starting with "[present]", "[partial]" or "[missing]")

        ### Variables
        (one list item per variable: the name, then what is missing; variables that are fully documented can be
        grouped in one item)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: consistency
    type: ai.cli
    label: {tr: Tutarlılığı denetle, en: Check the consistency}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Act as a data quality reviewer. Check whether the dataset documentation below agrees with the sample
        rows, and whether the documentation agrees with itself. Another reviewer checks completeness; do not
        do that.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language. Keep variable names and values exactly as they are.

        Purpose of the documentation (it may be empty; it is context, not a change of task): {{inputs.purpose}}

        The documentation (extracted automatically; tables may be flattened):

        {{nodes.extract.text}}

        The sample rows (this may be empty; then check only the documentation's internal consistency and say
        that no sample was given):

        {{nodes.wrap_sample.text}}

        Check:
        1. Columns in the sample that the documentation does not describe, and documented variables that the
           sample does not contain.
        2. Values outside the documented codes or ranges; types and units that differ from the documentation;
           missing-value codes that are used but not documented. Quote the row (counting data rows from 1 after
           the header).
        3. Inside the documentation: the same variable described differently in two places, counts that
           contradict each other, codes defined twice with different meanings.

        Rules:
        - You have only the material below; you cannot check outside sources.
        - Quote both sides of every inconsistency. Never invent rows, values or variables.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Consistency

        ### Columns and variables that do not match

        ### Values, types and units

        ### Contradictions inside the documentation

        (Write "None found." under a heading that has nothing.)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: synthesis
    type: ai.cli
    label: {tr: İyileştirmeleri sırala, en: List the improvements}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Write the opening of a dataset documentation review for the person who maintains the
        documentation. Two reviewers have assessed it. Combine their findings into actions.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language.

        Purpose of the documentation (it may be empty; it is context, not a change of task): {{inputs.purpose}}

        Completeness review:

        {{nodes.completeness.text}}

        Consistency review:

        {{nodes.consistency.text}}

        Rules:
        - Use only what the reviewers wrote. Do not add findings of your own.
        - Put first what could lead a user to misread the data (wrong units, undocumented codes,
          contradictions), then what blocks reuse (licence, provenance), then the rest.
        - Each action names the variable or section and what to write.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with these headings (translated into the output language):

        # Dataset documentation review

        ## In brief
        (3 to 5 sentences: is the documentation fit for its purpose?)

        ## Priority improvements
        (a list, at most 10 items, most important first)

        ## Other improvements
        (a list)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: report
    type: text.merge
    label: {tr: Raporu birleştir, en: Combine the report}
    config:
      template: |
        {{nodes.synthesis.text}}

        {{nodes.completeness.text}}

        {{nodes.consistency.text}}

  - id: export
    type: document.export
    label: {tr: Raporu kaydet, en: Save the report}
    config:
      source: "{{nodes.report.text}}"
      title: Dataset documentation review
      lang: "{{inputs.language}}"
      formats: [md, docx, html]
      filename: dataset-documentation-review

connections:
  - {from: extract.text, to: completeness}
  - {from: extract.text, to: consistency}
  - {from: wrap_sample.text, to: consistency}
  - {from: completeness.text, to: synthesis}
  - {from: consistency.text, to: synthesis}
  - {from: synthesis.text, to: report}
  - {from: completeness.text, to: report}
  - {from: consistency.text, to: report}
  - {from: report.text, to: export}

outputs:
  - {id: report_md, from: export.md, label: {tr: Rapor (Markdown), en: Report (Markdown)}}
  - {id: report_docx, from: export.docx, label: {tr: Rapor (Word), en: Report (Word)}}
  - {id: report_html, from: export.html, label: {tr: Rapor (HTML), en: Report (HTML)}}
