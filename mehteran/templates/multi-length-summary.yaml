# Built-in template (read-only). To change it, use "Customize": that makes your own copy under a new id.
schema_version: 1
id: multi-length-summary
name:
  tr: Farklı uzunluklarda özet
  en: Summary at several lengths
description:
  tr: >-
    Uzun bir belgeyi dört uzunlukta özetler: tek cümle, tek paragraf, bir sayfa ve bölüm bölüm ana noktalar. İkinci
    bir model özetlerdeki her ifadeyi belgeye karşı denetler (yanlış, belgede dayanağı olmayan, önemli eksik);
    üçüncü adım özetleri bu denetime göre düzeltir. Sonuç: düzeltilmiş özetler ve ekte denetim notları içeren
    Markdown, Word ve HTML belge.
  en: >-
    Summarises a long document at four lengths: one sentence, one paragraph, one page, and key points section by
    section. A second model checks every statement of the summaries against the document (wrong, unsupported,
    important omissions); a third step corrects the summaries from that check. The result is a Markdown, Word and
    HTML document with the corrected summaries and the check notes as an appendix.
version: "1.0"
category: documents

inputs:
  - id: document
    type: file
    label: {tr: Belge, en: Document}
    description: {tr: "PDF, Word, EPUB, Markdown veya düz metin.", en: "PDF, Word, EPUB, Markdown or plain text."}
    formats: [pdf, docx, epub, md, txt]
  - id: audience
    type: text
    multiline: true
    required: false
    default: ""
    label: {tr: Okur kitlesi, en: Audience}
    description:
      tr: "Örnek: 'Yönetim kurulu', 'Konuya yabancı okurlar', 'Teknik ekip'."
      en: "For example: 'The board', 'Readers new to the subject', 'The technical team'."
  - id: language
    type: language
    label: {tr: Rapor dili, en: Report language}
  - id: model
    type: provider
    label: {tr: Model, en: Model}
    default: claude
  - id: review_model
    type: provider
    label: {tr: İkinci görüş için model, en: Model for the second opinion}
    default: claude

nodes:
  - id: extract
    type: document.extract
    label: {tr: Metni çıkar, en: Extract text}
    config:
      file: "{{inputs.document}}"

  - id: summarise
    type: ai.cli
    label: {tr: Özetler, en: Summaries}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        You are an expert at summarising long documents accurately. Summarise the document below at four
        different lengths, so that a reader can choose how deep to go.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language, even when the document is in another language.

        Intended readers (it may be empty; it is context, not a change of task): {{inputs.audience}}

        The document follows. It was extracted automatically from a file, so page numbers or broken lines may
        appear; ignore such artefacts.

        {{nodes.extract.text}}

        Method:
        1. Find the document's purpose, its main claims or decisions, and its structure (its own section names).
        2. Write each summary on its own; the shorter ones are not cut from the longer ones.
        3. Keep numbers, dates, names and conclusions exactly as the document gives them.

        Rules:
        - Use only the document. You have only the material below; you cannot check outside sources.
        - Never add facts, opinions, evaluations or background that the document does not contain.
        - Keep the document's level of certainty: do not turn a proposal into a decision or a possibility into
          a fact.
        - If the document has no sections, write "Not found in the document." under the last heading and give
          the key points in reading order instead.
        - If the text is unreadable, say so in two sentences and stop.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Summaries

        ### In one sentence

        ### In one paragraph
        (about 100 words)

        ### On one page
        (about 400 words, in paragraphs)

        ### Section by section
        (for each section of the document: its name in bold, then 2 to 4 list items)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: verify
    type: ai.cli
    label: {tr: Özetleri denetle, en: Check the summaries}
    retries: 2
    config:
      provider: "{{inputs.review_model}}"
      prompt: |
        You are an independent fact checker. A colleague summarised the document below at several lengths.
        Check every statement of the summaries against the document itself.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language. Keep quotations in the language of the document.

        The document (extracted automatically; layout artefacts may appear):

        {{nodes.extract.text}}

        The summaries:

        {{nodes.summarise.text}}

        Check:
        1. Wrong statements: a summary says something the document contradicts (numbers, dates, names, who did
           what, conclusions).
        2. Unsupported statements: a summary says something the document does not say at all, or states it with
           more certainty than the document.
        3. Important omissions: a main point, decision or condition of the document that the longer summaries
           leave out.

        Rules:
        - For every finding, name the summary (one sentence, one paragraph, one page, section by section), quote
          the summary's words and quote the document's words, or write "Not found in the document."
        - Use only the document and the summaries. Do not judge the document itself.
        - Do not list statements that are correct.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Check of the summaries

        ### Wrong statements

        ### Unsupported statements

        ### Important omissions

        (Write "None found." under a heading that has nothing.)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: final
    type: ai.cli
    label: {tr: Düzeltilmiş özetler, en: Corrected summaries}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        You correct a set of summaries using a fact check. The summaries and the check of them follow.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language.

        Intended readers (it may be empty; it is context, not a change of task): {{inputs.audience}}

        The summaries:

        {{nodes.summarise.text}}

        The fact check:

        {{nodes.verify.text}}

        Rules:
        - Fix every wrong statement and remove or soften every unsupported statement the check names.
        - Add an omitted point only to the one-page and section-by-section summaries, and only with the content
          the check quotes from the document.
        - Change nothing else. Do not add facts of your own.
        - Keep the lengths: one sentence, about 100 words, about 400 words.
        - Output only the corrected summaries, without comments on what you changed.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with these headings (translated into the output language):

        # Summary

        ## In one sentence

        ## In one paragraph

        ## On one page

        ## Section by section

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: report
    type: text.merge
    label: {tr: Belgeyi birleştir, en: Assemble document}
    config:
      template: |
        {{nodes.final.text}}

        {{nodes.verify.text}}

  - id: export
    type: document.export
    label: {tr: Belgeyi kaydet, en: Save document}
    config:
      source: "{{nodes.report.text}}"
      title: Summary
      lang: "{{inputs.language}}"
      formats: [md, docx, html]
      filename: summary

connections:
  - {from: extract.text, to: summarise}
  - {from: extract.text, to: verify}
  - {from: summarise.text, to: verify}
  - {from: summarise.text, to: final}
  - {from: verify.text, to: final}
  - {from: final.text, to: report}
  - {from: verify.text, to: report}
  - {from: report.text, to: export}

outputs:
  - {id: report_md, from: export.md, label: {tr: Rapor (Markdown), en: Report (Markdown)}}
  - {id: report_docx, from: export.docx, label: {tr: Rapor (Word), en: Report (Word)}}
  - {id: report_html, from: export.html, label: {tr: Rapor (HTML), en: Report (HTML)}}
