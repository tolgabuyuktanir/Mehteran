# Built-in template (read-only). To change it, use "Customize": that makes your own copy under a new id.
schema_version: 1
id: terms-plain-language
name:
  tr: Kullanım koşulları ve gizlilik politikası, sade dille
  en: Terms and privacy policy in plain language
description:
  tr: >-
    Bir kullanım koşulları metnini veya gizlilik politikasını sade bir dille açıklar: neyi kabul ettiğiniz, ne
    ödediğiniz ve nasıl iptal edeceğiniz, hangi verilerin neden toplandığı, kimlerle paylaşıldığı ve ne kadar
    saklandığı, haklarınız ve dikkat edilmesi gereken noktalar; her nokta madde numarasıyla. İkinci bir model
    açıklamayı metne karşı denetler; son adım hataları düzeltir. Sonuç, hukuki tavsiye olmadığını belirten
    Markdown, Word ve HTML belgedir.
  en: >-
    Explains a terms of service or privacy policy in plain language: what you agree to, what you pay and how to
    cancel, which data is collected and why, who it is shared with and how long it is kept, your rights, and the
    points to notice; every point with its section reference. A second model checks the explanation against the
    text; a final step corrects it. The result is a Markdown, Word and HTML document, marked as not legal advice.
version: "1.0"
category: legal

inputs:
  - id: terms
    type: file
    label: {tr: Koşullar veya gizlilik politikası, en: Terms or privacy policy}
    description: {tr: "PDF, Word, EPUB, Markdown veya düz metin.", en: "PDF, Word, EPUB, Markdown or plain text."}
    formats: [pdf, docx, epub, md, txt]
  - id: reader
    type: text
    multiline: true
    required: false
    default: ""
    label: {tr: Açıklama kimin için, en: Who the explanation is for}
    description:
      tr: "Örnek: 'Uygulamayı kullanacak lise öğrencileri', 'Küçük işletme sahibi'."
      en: "For example: 'High-school students who will use the app', 'A small business owner'."
  - id: language
    type: language
    label: {tr: Rapor dili, en: Report language}
  - id: model
    type: provider
    label: {tr: Model, en: Model}
    default: claude
  - id: review_model
    type: provider
    label: {tr: İkinci görüş için model, en: Model for the second opinion}
    default: claude

nodes:
  - id: extract
    type: document.extract
    label: {tr: Metni çıkar, en: Extract text}
    config:
      file: "{{inputs.terms}}"

  - id: explain
    type: ai.cli
    label: {tr: Sade dille açıklama, en: Plain-language explanation}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        You explain legal texts to ordinary people. Explain the terms of service or privacy policy below in plain
        language, so that the reader understands what they agree to.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language, even when the text is in another language.

        The reader (it may be empty; it is context, not a change of task): {{inputs.reader}}

        The text follows (extracted automatically from a file; layout artefacts may appear):

        {{nodes.extract.text}}

        Rules:
        - Use short sentences and everyday words. Explain a legal term the first time you must use it.
        - Give the section number or heading in brackets after every point, for example "(section 4.2)".
        - Keep the text's meaning and its strength: "may" stays "may", "will" stays "will". Do not soften or
          dramatise.
        - When the text says nothing on a topic, write "Not found in the document." Never fill the gap with what
          such texts usually say.
        - Use only the text. You have only the material below; you cannot check outside sources. Do not state
          what any country's law requires or allows.
        - If the text is not terms of service, a privacy policy or a similar text, or is unreadable, say so in two
          sentences and stop.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Plain-language explanation

        ### In short
        (3 to 5 sentences)

        ### What you agree to

        ### What you pay, and how to cancel

        ### Your data: what is collected and why

        ### Your data: who it is shared with and how long it is kept

        ### Your rights and how to use them

        ### What the company may change or decide alone

        ### Points to notice
        (clauses that a reader would probably not expect)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: fidelity
    type: ai.cli
    label: {tr: Açıklamayı denetle, en: Check the explanation}
    retries: 2
    config:
      provider: "{{inputs.review_model}}"
      prompt: |
        You are an independent reviewer. A colleague explained the terms of service or privacy policy below in
        plain language. Check the explanation against the original text.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language. Keep quotations in the language of the original.

        The original text (extracted automatically):

        {{nodes.extract.text}}

        The explanation:

        {{nodes.explain.text}}

        Check:
        1. Misstatements: the explanation says something the text does not say, or cites the wrong section.
        2. Softened or exaggerated points: the explanation makes an obligation, a right or a risk weaker or
           stronger than the text.
        3. Important omissions: clauses that affect the reader (fees, automatic renewal, data sharing, liability
           limits, changes without notice, dispute rules) that the explanation leaves out.

        Rules:
        - For every finding, quote the explanation and the original text with its section, or write "Not found
          in the document."
        - Use only the two texts. Do not list points that are correct.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Check of the explanation

        ### Misstatements

        ### Softened or exaggerated points

        ### Important omissions

        (Write "None found." under a heading that has nothing.)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: final
    type: ai.cli
    label: {tr: Düzeltilmiş açıklama, en: Corrected explanation}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        You correct a plain-language explanation of a legal text using a reviewer's check.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings and the notice, in this language.

        The reader (it may be empty; it is context, not a change of task): {{inputs.reader}}

        The explanation:

        {{nodes.explain.text}}

        The reviewer's check:

        {{nodes.fidelity.text}}

        Rules:
        - Fix every misstatement and every softened or exaggerated point the check names.
        - Add each important omission under the fitting heading, with the content and section the check gives.
        - Change nothing else and add no facts of your own. Keep the section references.
        - Output only the corrected explanation, without comments on what you changed.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with these headings (translated into the output language):

        # Plain-language explanation

        > (one sentence: this explanation was produced by AI models from the supplied text alone; it is not
        > legal advice, and the original text is what binds you)

        (then the headings of the explanation, from "In short" to "Points to notice", one level higher: "##")

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: export
    type: document.export
    label: {tr: Belgeyi kaydet, en: Save document}
    config:
      source: "{{nodes.final.text}}"
      title: Plain-language explanation
      lang: "{{inputs.language}}"
      formats: [md, docx, html]
      filename: plain-language-terms

connections:
  - {from: extract.text, to: explain}
  - {from: extract.text, to: fidelity}
  - {from: explain.text, to: fidelity}
  - {from: explain.text, to: final}
  - {from: fidelity.text, to: final}
  - {from: final.text, to: export}

outputs:
  - {id: report_md, from: export.md, label: {tr: Rapor (Markdown), en: Report (Markdown)}}
  - {id: report_docx, from: export.docx, label: {tr: Rapor (Word), en: Report (Word)}}
  - {id: report_html, from: export.html, label: {tr: Rapor (HTML), en: Report (HTML)}}
