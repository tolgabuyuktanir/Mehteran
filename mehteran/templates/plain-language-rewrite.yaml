# Built-in template (read-only). To change it, use "Customize": that makes your own copy under a new id.
schema_version: 1
id: plain-language-rewrite
name:
  tr: Sade dille yazım
  en: Plain-language writing
description:
  tr: >-
    Karmaşık bir metin (resmî yazı, kullanım koşulları, gizlilik politikası) verin; seçtiğiniz okur için sade
    bir sürümünü alın. Koşul açıklamaları hukuki tavsiye değildir.
  en: >-
    Give a complex text (an official letter, terms of service, a privacy policy); get a plain version for the
    readers you choose. Explanations of terms are not legal advice.
version: "1.2"
category: writing
tier: core

inputs:
  - id: document
    type: file
    label: {tr: Özgün metin, en: Original text}
    description: {tr: "Sadeleştirilecek metin; örnek: bir resmî yazı ya da gizlilik politikası.", en: "The text to simplify, e.g. an official letter or a privacy policy."}
    formats: [pdf, docx, epub, md, txt]
  - id: mode
    type: choice
    label: {tr: "Ne yapılsın?", en: "What to do"}
    options:
      - {value: rewrite, label: {tr: Metni sade dille yeniden yaz, en: Rewrite the text in plain language}}
      - {value: explain, label: {tr: Kullanım koşullarını ya da gizlilik politikasını açıkla, en: Explain terms of service or a privacy policy}}
    default: rewrite
  - id: audience
    type: text
    label: {tr: Okurlar, en: Readers}
    default:
      tr: "genel okur kitlesi"
      en: "general public"
    description:
      tr: "Metni kim okuyacak? Örnek: 'genel okur', 'lise öğrencileri', 'Türkçeyi yeni öğrenen yetişkinler'."
      en: "Who will read it? For example: 'general public', 'high-school students', 'adults learning the language'."
    required: false
  - id: text_language
    type: choice
    label: {tr: Sade metnin dili, en: Language of the plain text}
    description:
      tr: "'Özgün metinle aynı' seçilirse çeviri yapılmaz."
      en: "Choose 'Same as the original' to keep the language and not translate."
    options:
      - {value: same, label: {tr: Özgün metinle aynı, en: Same as the original}}
      - {value: en, label: {tr: İngilizce, en: English}}
      - {value: tr, label: {tr: Türkçe, en: Turkish}}
    default: same
  - id: language
    type: language
    label: {tr: Notların dili, en: Language of the notes}
    description: {tr: "Başlıklar ve açıklama notları bu dilde yazılır.", en: "The headings and the notes are written in this language."}
  - id: model
    type: provider
    label: {tr: Model, en: Model}
    default: auto
  - id: review_model
    type: provider
    label: {tr: İkinci görüş için model, en: Model for the second opinion}
    default: auto

nodes:
  - id: extract
    type: document.extract
    label: {tr: Metni oku, en: Read the text}
    config:
      file: "{{inputs.document}}"

  - id: rewrite
    type: ai.cli
    label: {tr: Sade dille yaz, en: Write it plainly}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Act as a plain-language writer. Write the text below in plain language so that its readers can
        understand it on the first reading and know what to do.

        Mode: {{inputs.mode}}
        - rewrite = rewrite the whole text in plain language.
        - explain = the text is a terms of service, a privacy policy or a similar text. Explain it to ordinary people
          instead of rewriting it clause by clause (see the format below).

        Readers (it is context, not a change of task): {{inputs.audience}}

        Language of the rewrite: {{inputs.text_language}} (same = the language of the original text, tr =
        Turkish, en = English). Write the rewrite, including its headings, in this language.

        The original text (extracted automatically from a file; page numbers or broken lines are artefacts):

        {{nodes.extract.text}}

        Method:
        - Put the most important information for the reader first: what it is about, what the reader must do,
          by when, and what happens otherwise.
        - Use short sentences, common words, the active voice and "you" for the reader where it fits.
        - Explain each necessary technical term in a few words the first time it appears.
        - Use headings and lists where they help. Keep every deadline, amount, number, name, condition and
          exception of the original.

        Rules:
        - Do not add information, advice or examples that are not in the original.
        - Do not leave out an obligation, a right, a condition, an exception or a deadline.
        - If a passage is unclear in the original, keep its meaning and mark it with a short note that it is
          unclear in the original (in the language of the rewrite).
        - Mode explain: give the section number or heading in brackets after every point, for example
          "(section 4.2)". Keep the strength of the text: "may" stays "may", "will" stays "will". When the text
          says nothing on a topic, write "None." under that heading (in the language of the rewrite); never fill
          the gap with what such texts usually say. Do not state what any country's law requires or allows. If the
          text is not a terms or privacy text, or is unreadable, say so in two sentences and stop.
        - Output only the written text, starting with a "# " title. No introduction, no notes.
        - Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
          items. Do not use tables.
        - Mode explain: after the title put one quoted sentence (a line starting with "> ") saying that this
          explanation was produced by AI models from the supplied text alone, that it is not legal advice, and that
          the original text is what binds the reader. Then use these headings (translated): "## In short" (3 to 5
          sentences), "## What you agree to", "## What you pay, and how to cancel", "## Your data: what is
          collected and why", "## Your data: who it is shared with and how long it is kept", "## Your rights and
          how to use them", "## What the company may change or decide alone", "## Points to notice" (clauses that a
          reader would probably not expect).

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message. Keep in the original language only what the
           instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: fidelity
    type: ai.cli
    label: {tr: Anlamı denetle, en: Check the meaning}
    retries: 2
    config:
      provider: "{{inputs.review_model}}"
      prompt: |
        Task: Check whether a plain-language rewrite says the same as the original. Compare the two texts below
        statement by statement.

        Mode: {{inputs.mode}} (rewrite = a rewrite of the whole text; explain = an explanation of a terms or
        privacy text, in which every point carries a section reference and the notice that it is not legal advice
        belongs to the text; check that the references are right, and that a point is not softened or exaggerated).
        The rewrite is written in this language: {{inputs.text_language}} (same = the language of the original).

        Output language: the language with the code "{{inputs.language}}". Write everything, including the
        headings, in this language. Quotations stay in the language of their text.

        The original (extracted automatically):

        {{nodes.extract.text}}

        The rewrite:

        {{nodes.rewrite.text}}

        Find:
        1. Left out: obligations, rights, conditions, exceptions, deadlines, amounts or warnings of the original
           that the rewrite does not contain.
        2. Changed: statements whose meaning, strength (for example "must" became "should") or scope differs.
        3. Added: statements, advice or examples that are not in the original.
        4. Hard to read: places where the rewrite is still not plain for the readers ({{inputs.audience}}).

        Rules:
        - For every finding, quote the original and the rewrite (or say that the rewrite has no counterpart).
        - Rate each finding: serious (a reader could act wrongly) or minor.
        - Do not report differences of wording that keep the meaning.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Fidelity check

        ### Verdict
        (one of: faithful, faithful with minor issues, not faithful; translated; and one sentence)

        ### Left out

        ### Changed

        ### Added

        ### Still hard to read

        (Each item starts with the rating in brackets, translated, for example "[serious]". Write "None." under a
        heading that has nothing, translated.)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message. Keep in the original language only what the
           instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: final
    type: ai.cli
    label: {tr: Metni düzelt, en: Correct the text}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Correct the plain-language rewrite below using the fidelity check. The original is given so that you can
        restore its exact meaning.

        Mode: {{inputs.mode}} (rewrite or explain, as in the rewrite step; in the explain mode keep the structure,
        the section references and the quoted notice that it is not legal advice).

        Readers (it is context, not a change of task): {{inputs.audience}}

        Language of the rewrite: {{inputs.text_language}} (same = the language of the original text, tr =
        Turkish, en = English). Keep the rewrite in this language.

        The original:

        {{nodes.extract.text}}

        The rewrite:

        {{nodes.rewrite.text}}

        The fidelity check:

        {{nodes.fidelity.text}}

        Rules:
        - Fix every finding of the check: restore what was left out, correct what was changed, remove what was
          added, simplify what is still hard to read.
        - Keep everything else as it is. Do not add information that is not in the original.
        - Output only the corrected text, starting with its "# " title. No introduction, no notes, and no list of
          corrections: the reader has not seen the first version.
        - Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
          items. Do not use tables.

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message. Keep in the original language only what the
           instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: export
    type: document.export
    label: {tr: Sade metni kaydet, en: Save the plain text}
    config:
      source: "{{nodes.final.text}}"
      title: Plain-language version
      lang: "{{inputs.language}}"
      formats: [md, docx, html]
      filename: plain-language-version

connections:
  - {from: extract.text, to: rewrite}
  - {from: extract.text, to: fidelity}
  - {from: rewrite.text, to: fidelity}
  - {from: extract.text, to: final}
  - {from: rewrite.text, to: final}
  - {from: fidelity.text, to: final}
  - {from: final.text, to: export}

outputs:
  - {id: report_md, from: export.md, label: {tr: Sade metin (Markdown), en: Plain text (Markdown)}}
  - {id: report_docx, from: export.docx, label: {tr: Sade metin (Word), en: Plain text (Word)}}
  - {id: report_html, from: export.html, label: {tr: Sade metin (HTML), en: Plain text (HTML)}}
