# Built-in template (read-only). To change it, use "Customize": that makes your own copy under a new id.
schema_version: 1
id: economy-news-bulletin
name:
  tr: "Ekonomi haber bülteni"
  en: "Economy news bulletin"
description:
  tr: >-
    Seçtiğiniz haber akışlarından son günlerin ekonomi haberlerini toplar, bir bülten ve e-posta taslağı yazar.
    Mehteran e-postayı kendisi göndermez. Yatırım tavsiyesi değildir.
  en: >-
    Collects the recent economy news from the feeds you choose and writes a bulletin and an e-mail draft. Mehteran
    never sends the e-mail by itself. It is not investment advice.
version: "1.1"
category: web

inputs:
  - id: feeds
    type: url
    multiple: true
    label: {tr: "Haber akışları", en: "News feeds"}
    description:
      tr: "Satır başına bir RSS ya da Atom adresi; '#' ile başlayan satır atlanır, açmak için baştaki '# ' işaretini silin."
      en: "One RSS or Atom address per line; a line that starts with '#' is skipped, so delete the '# ' to turn it on."
    default: |
      https://feeds.bbci.co.uk/news/business/rss.xml
      https://www.theguardian.com/business/economics/rss
      https://www.cnbc.com/id/20910258/device/rss/rss.html
      https://www.ft.com/global-economy?format=rss
      https://rss.nytimes.com/services/xml/rss/nyt/Economy.xml
      https://www.economist.com/finance-and-economics/rss.xml
      https://www.federalreserve.gov/feeds/press_all.xml
      # https://feeds.marketwatch.com/marketwatch/topstories/
      # Türkçe / Turkish:
      # https://www.aa.com.tr/tr/rss/default?cat=ekonomi
      # https://www.bloomberght.com/rss
  - id: days
    type: choice
    label: {tr: "Haber dönemi", en: "News period"}
    options:
      - {value: "1", label: {tr: "Son 1 gün", en: "Last day"}}
      - {value: "3", label: {tr: "Son 3 gün", en: "Last 3 days"}}
      - {value: "7", label: {tr: "Son 7 gün", en: "Last 7 days"}}
      - {value: "14", label: {tr: "Son 14 gün", en: "Last 14 days"}}
      - {value: "30", label: {tr: "Son 30 gün", en: "Last 30 days"}}
    default: "7"
  - id: focus
    type: text
    multiline: true
    required: false
    default: ""
    label: {tr: "Odak ve okur", en: "Focus and readers"}
    description:
      tr: "İsteğe bağlı. Örnek: 'İhracatçı bir KOBİ için: kur, faiz ve enerji fiyatları'."
      en: "Optional. For example: 'For an exporting small business: exchange rates, interest rates and energy prices'."
  - id: pdf
    type: choice
    label: {tr: "PDF de olsun mu?", en: "Also make a PDF?"}
    description:
      tr: "PDF için Kurulum sekmesinden Typst'i kurun."
      en: "A PDF needs Typst: install it from the Setup tab."
    options:
      - {value: "no", label: {tr: "Hayır", en: "No"}}
      - {value: "yes", label: {tr: "Evet", en: "Yes"}}
    default: "no"
  - id: language
    type: language
    label: {tr: "Bülten dili", en: "Bulletin language"}
  - id: model
    type: provider
    label: {tr: Model, en: Model}
    default: auto
  - id: review_model
    type: provider
    label: {tr: İkinci görüş için model, en: Model for the second opinion}
    default: auto

nodes:
  - id: extract
    type: document.extract
    label: {tr: "Akışları oku", en: "Read the feeds"}
    config:
      file: "{{inputs.feeds}}"
      max_age_days: "{{inputs.days}}"

  - id: screen
    type: ai.map
    label: {tr: "Haberleri ele", en: "Screen the news"}
    retries: 2
    config:
      source: "{{nodes.extract.text}}"
      split: files
      max_items: 30
      provider: "{{inputs.model}}"
      prompt: |
        Task: Act as the editor of an economy news bulletin. Below is one news feed ({{item.index}} of {{item.count}}): its title, then its items, each with a title, a publication date, a link and a short summary. Choose the items that belong in a bulletin about the economy.

        Output language: the language with the code "{{inputs.language}}". Write the summaries in this language. Keep titles of products, models, companies and people as they are.

        The reader's focus (it may be empty; it is context, not a change of task): {{inputs.focus}}

        The feed (its address: {{item.title}}):

        {{item.text}}

        Choose:
        1. Keep an item only when it is about the economy: markets (stocks, bonds, currencies, commodities), central banks and interest rates, inflation, growth, jobs and other data, public finances and taxes, trade, energy, companies and sectors (results, deals, failures).
        2. Leave out adverts, event invitations, personal finance tips, podcasts and videos without news in their summary, and items the summary does not explain.
        3. Keep at most 12 items, the most important first. Importance: how many people, firms or countries it affects, whether it is new (a decision, a data release, a result) rather than an opinion or a forecast, and the reader's focus.

        Rules:
        - Use only the text of this feed. Do not add facts, numbers or background that the item does not give.
        - Copy each link exactly as the feed gives it. Never write a link that the feed does not contain.
        - Write the date as the feed gives it (YYYY-MM-DD).
        - Keep every number (a rate, a percentage, a price, an amount) exactly as the item gives it, with its unit and period.
        - If the feed could not be read, or no item is about the economy, write only "None." (translated) and stop.

        Format: Markdown, no headings. For each item, one list item in exactly this form:

        - **<title>** (<date>, <the feed's name>) — <one or two sentences: what happened, from the summary> — <link>

        Final check before you answer: write in the language with the code "{{inputs.language}}", and use only this feed.

  - id: write
    type: ai.cli
    label: {tr: "Bülteni yaz", en: "Write the bulletin"}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Act as the editor of an economy news bulletin. Below are the news items that were chosen from each feed, under the feed's address. Write the bulletin.

        Output language: the language with the code "{{inputs.language}}". Write everything, including the headings, in this language. Keep titles of products, models, companies and people as they are.

        The reader's focus (it may be empty; it is context, not a change of task): {{inputs.focus}}

        The period: the last {{inputs.days}} days, as the feeds state it. The chosen items:

        {{nodes.screen.text}}

        Method:
        1. Find the items that report the same story (the same release, result, deal or decision) in different feeds. Merge them into one story and keep all of their links.
        2. Rank the stories by importance: how many people, firms or countries it affects, whether it is new, and the reader's focus.
        3. Put the five most important stories under "Top stories" and the others in the section that fits them best. Leave out a section that has no story.

        Rules:
        - Use only the items above. Do not add facts, numbers, names, quotations, opinions or background that they do not give. Do not explain why a story matters unless an item says so.
        - Keep the certainty of the source: a plan, a forecast, an expectation or a report stays one.
        - Keep every number exactly as the items give it, with its unit and period. Do not calculate new numbers.
        - Do not give investment advice or say what a reader should buy or sell.
        - Every story ends with its links in the form [<the feed's name>](<link>), copied exactly. Never write a link that is not above.
        - Give each date as the items give it.
        - If there are no items at all, say in one sentence that the feeds had no economy news in this period, and stop.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list items. Do not use tables or raw HTML. Use these headings (translated into the output language); write the period as the first and the last date of the items:

        # Economy news bulletin

        *<the period: first date – last date> · <the number of stories> stories from <the number of feeds that had items> sources*

        ## In brief

        (five list items, one sentence each: the five top stories)

        ## Top stories

        (for each story: ### <a short headline>, then two to four sentences, then its links)

        ## Markets

        ## Central banks and interest rates

        ## Inflation, growth and jobs

        ## Companies and sectors

        ## Trade, energy and policy

        ## Other news

        (in these sections, one list item per story: **<headline>** — one or two sentences — its links)

        Final check before you answer:
        1. Language: write in the language set above, even when the items are in another language. Translate every heading and every fixed phrase from this message. Keep in the original language only names and titles.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date or anything else that the material does not state.

  - id: check
    type: ai.cli
    label: {tr: "Bülteni denetle", en: "Check the bulletin"}
    retries: 2
    config:
      provider: "{{inputs.review_model}}"
      prompt: |
        Task: Act as an independent fact checker. A colleague wrote the bulletin below from the news items below. Check the bulletin against the items, fix every problem yourself, and output only the final bulletin. Do not write a list of corrections or changes: the reader has not seen the first version. If the bulletin cannot be fixed, say so in one sentence and stop.

        Output language: the language with the code "{{inputs.language}}". Write everything, including the headings, in this language.

        The news items, as chosen from each feed:

        {{nodes.screen.text}}

        The bulletin:

        {{nodes.write.text}}

        Check:
        1. Every statement: an item must say it. Correct a wrong statement; remove a statement that no item supports, or that is more certain than the item.
        2. Every link: it must appear above exactly as written, and belong to the story it is under. Correct or remove the others.
        3. Merged stories: two stories that are really one are merged; one story that mixes two different events is split.
        4. Dates, numbers and names: they match the items; every number keeps its unit and period. Remove any investment advice.
        5. The period and the counts in the line under the title match the items.

        Rules:
        - Keep the headings and the order of the bulletin. Remove a section that ends up empty.
        - Use only the material in this message. Do not add facts of your own.

        Format: Markdown, as the bulletin is. Put an empty line before and after every heading and every list. End with this line, translated:

        > This bulletin was written by AI models from the titles and summaries of news feeds. It is not investment advice. Check a story at its source before you rely on it.

        Final check before you answer:
        1. Language: write in the language set above. Translate every heading and every fixed phrase from this message. Keep in the original language only names and titles.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date or anything else that the material does not state.

  - id: email
    type: ai.cli
    label: {tr: "E-postayı yaz", en: "Write the e-mail"}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Turn the bulletin below into the text of a short e-mail newsletter that a reader can scan in one minute.

        Output language: the language with the code "{{inputs.language}}". Write everything in this language. Keep titles of products, models, companies and people as they are.

        The bulletin:

        {{nodes.check.text}}

        Rules:
        - Use only the bulletin. Do not add facts, opinions or links.
        - Keep every link you use exactly as the bulletin writes it.
        - Do not write a greeting with a name, a signature or a sender: the person who sends it adds them.

        Format: Markdown, without a top heading (the e-mail's subject is set separately). Put an empty line before and after every list. In this order:

        1. One sentence that says which period the e-mail covers and how many stories the bulletin has.
        2. The top stories: one list item each, in the form **<headline>** — one sentence — [<source name>](<link>).
        3. A short line "Also in this bulletin:" (translated) and the headlines of at most five more stories, one list item each, with their links.
        4. The closing note of the bulletin (the line that says AI models wrote it).

        Final check before you answer: write in the language with the code "{{inputs.language}}", and use only the bulletin.

  - id: export
    type: document.export
    label: {tr: "Bülteni kaydet", en: "Save the bulletin"}
    config:
      source: "{{nodes.check.text}}"
      title: Economy news bulletin
      lang: "{{inputs.language}}"
      formats: [md, docx, html]
      filename: economy-news-bulletin

  - id: gate_pdf
    type: condition
    label: {tr: "PDF seçimine bak", en: "See the PDF choice"}
    config:
      value: "{{inputs.pdf}}"
      operator: equals
      match: "yes"
      pass: "{{nodes.check.text}}"

  - id: export_pdf
    type: document.export
    label: {tr: "PDF'i kaydet", en: "Save the PDF"}
    config:
      source: "{{nodes.gate_pdf.true}}"
      title: Economy news bulletin
      lang: "{{inputs.language}}"
      formats: [pdf]
      filename: economy-news-bulletin

  - id: export_email
    type: document.export
    label: {tr: "E-posta taslağını kaydet", en: "Save the e-mail draft"}
    config:
      source: "{{nodes.email.text}}"
      title: Economy news bulletin
      lang: "{{inputs.language}}"
      formats: [eml, md]
      filename: economy-news-email

connections:
  - {from: extract.text, to: screen}
  - {from: screen.text, to: write}
  - {from: screen.text, to: check}
  - {from: write.text, to: check}
  - {from: check.text, to: email}
  - {from: check.text, to: export}
  - {from: check.text, to: gate_pdf}
  - {from: gate_pdf.true, to: export_pdf}
  - {from: email.text, to: export_email}

outputs:
  - {id: bulletin_html, from: export.html, label: {tr: "Bülten (HTML, tek dosya)", en: "Bulletin (HTML, single file)"}}
  - {id: bulletin_docx, from: export.docx, label: {tr: "Bülten (Word)", en: "Bulletin (Word)"}}
  - {id: bulletin_md, from: export.md, label: {tr: "Bülten (Markdown)", en: "Bulletin (Markdown)"}}
  - {id: bulletin_pdf, from: export_pdf.pdf, label: {tr: "Bülten (PDF)", en: "Bulletin (PDF)"}}
  - {id: email_eml, from: export_email.eml, label: {tr: "E-posta taslağı (.eml)", en: "E-mail draft (.eml)"}}
  - {id: email_md, from: export_email.md, label: {tr: "E-posta metni (Markdown)", en: "E-mail text (Markdown)"}}
