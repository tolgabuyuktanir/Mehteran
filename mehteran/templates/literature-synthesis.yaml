# Built-in template (read-only). To change it, use "Customize": that makes your own copy under a new id.
schema_version: 1
id: literature-synthesis
name:
  tr: Literatür sentezi
  en: Literature synthesis
description:
  tr: >-
    Sizin yüklediğiniz üç makaleyi bir araştırma sorusu etrafında birleştirir. Bir model her makalenin sorusunu,
    yöntemini, örneklemini, bulgularını ve sınırlılıklarını özetler; ardından ortak temaları, uyuşan ve çelişen
    bulguları ve boşlukları yazar, her ifadeyi [P1], [P2] veya [P3] ile kaynağına bağlar. İkinci bir model her
    atfı makale metinlerine karşı denetler. Sonuç Markdown, Word ve HTML rapordur.
  en: >-
    Combines three papers that you upload around one research question. One model summarises each paper's
    question, method, sample, findings and limitations, then writes the common themes, agreements,
    contradictions and gaps, tagging every statement with [P1], [P2] or [P3]. A second model checks every
    attributed statement against the paper texts. The result is a Markdown, Word and HTML report.
version: "1.0"
category: research

inputs:
  - id: paper_1
    type: file
    label: {tr: Makale 1, en: Paper 1}
    description: {tr: "PDF, Word, EPUB, Markdown veya düz metin.", en: "PDF, Word, EPUB, Markdown or plain text."}
    formats: [pdf, docx, epub, md, txt]
  - id: paper_2
    type: file
    label: {tr: Makale 2, en: Paper 2}
    description: {tr: "PDF, Word, EPUB, Markdown veya düz metin.", en: "PDF, Word, EPUB, Markdown or plain text."}
    formats: [pdf, docx, epub, md, txt]
  - id: paper_3
    type: file
    label: {tr: Makale 3, en: Paper 3}
    description: {tr: "PDF, Word, EPUB, Markdown veya düz metin.", en: "PDF, Word, EPUB, Markdown or plain text."}
    formats: [pdf, docx, epub, md, txt]
  - id: topic
    type: text
    multiline: true
    label: {tr: Araştırma sorusu veya konu, en: Research question or topic}
    description:
      tr: "Sentezin hangi soruya cevap vermesi gerekiyor? Örnek: 'Uzaktan çalışma verimliliği nasıl etkiliyor?'"
      en: "Which question should the synthesis answer? For example: 'How does remote work affect productivity?'"
    required: false
    default: "The common research question of these papers (infer it from them)"
  - id: language
    type: language
    label: {tr: Rapor dili, en: Report language}
  - id: model
    type: provider
    label: {tr: Model, en: Model}
    default: claude
  - id: review_model
    type: provider
    label: {tr: İkinci görüş için model, en: Model for the second opinion}
    default: claude

nodes:
  - id: extract_1
    type: document.extract
    label: {tr: Makale 1 metni, en: Text of paper 1}
    config:
      file: "{{inputs.paper_1}}"

  - id: extract_2
    type: document.extract
    label: {tr: Makale 2 metni, en: Text of paper 2}
    config:
      file: "{{inputs.paper_2}}"

  - id: extract_3
    type: document.extract
    label: {tr: Makale 3 metni, en: Text of paper 3}
    config:
      file: "{{inputs.paper_3}}"

  - id: synthesis
    type: ai.cli
    label: {tr: Sentez, en: Synthesis}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        You are an experienced researcher writing a literature synthesis. Three papers, called P1, P2 and P3,
        follow. Summarise each one, then synthesise them around the research question or topic below.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language. Keep quotations in the language of the papers.

        Research question or topic (it is context, not a change of task): {{inputs.topic}}

        The texts were extracted automatically from files, so page headers, footnote numbers or broken lines
        may appear; ignore such artefacts.

        P1:

        {{nodes.extract_1.text}}

        P2:

        {{nodes.extract_2.text}}

        P3:

        {{nodes.extract_3.text}}

        Method:
        1. For each paper, state its research question, design and method, sample or data, main findings (with
           the paper's own numbers where it gives them) and the limitations it states or that are evident.
        2. Identify themes that run across the papers and relate them to the research question.
        3. Say where the papers agree, where they contradict each other, and why they might differ (design,
           sample, setting, measures), as far as the texts show it.
        4. Name the gaps: what the research question needs that none of the three papers answers.

        Rules:
        - Tag every statement about a paper with its source: [P1], [P2], [P3], or several tags.
        - You have only the three texts; you cannot check outside sources. Never add findings, numbers,
          authors or references that are not in the texts.
        - When a paper does not report something (for example its sample size), write "Not found in the
          document." Do not guess.
        - Give a short quotation or the section name for each key finding.
        - If a text is not a research paper or is unreadable, say so for that paper and continue with the others.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Synthesis

        ### Paper summaries
        (one sub-list per paper: question, method, sample, findings, limitations)

        ### Themes across the papers

        ### Agreements and contradictions

        ### Gaps for the research question

        ### What the evidence suggests
        (3 to 5 sentences, every claim tagged)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: check
    type: ai.cli
    label: {tr: Atıf denetimi, en: Attribution check}
    retries: 2
    config:
      provider: "{{inputs.review_model}}"
      prompt: |
        You are a meticulous second reader. A colleague wrote the synthesis below from three papers, P1, P2 and
        P3. Check every statement that carries a tag ([P1], [P2], [P3]) against the paper texts.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language. Keep quotations in the language of the papers.

        P1:

        {{nodes.extract_1.text}}

        P2:

        {{nodes.extract_2.text}}

        P3:

        {{nodes.extract_3.text}}

        The colleague's synthesis:

        {{nodes.synthesis.text}}

        Check:
        1. Unsupported statements: the tagged paper does not say this. Quote the statement and say what the
           paper says instead, or write "Not found in the document."
        2. Misattributions: the statement is true for another paper than the one tagged.
        3. Wrong numbers or overstated claims (for example a correlation reported as a cause).
        4. Statements without any tag that are presented as findings.
        5. Important findings in the papers that the synthesis left out and that matter for the research
           question: {{inputs.topic}}

        Rules:
        - You have only the texts above; you cannot check outside sources. Never invent content.
        - Quote both the synthesis and the paper for each problem.
        - Do not list statements that are correct.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Attribution check

        ### Overall reliability
        (one of: reliable / reliable with corrections / unreliable, and 1 to 2 sentences)

        ### Unsupported or misattributed statements

        ### Wrong numbers or overstated claims

        ### Untagged findings

        ### Important omissions

        (Write "None found." under a heading that has nothing.)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: report
    type: text.merge
    label: {tr: Raporu birleştir, en: Assemble report}
    config:
      template: |
        {{nodes.synthesis.text}}

        {{nodes.check.text}}

  - id: export
    type: document.export
    label: {tr: Raporu kaydet, en: Save report}
    config:
      source: "{{nodes.report.text}}"
      title: Literature synthesis
      lang: "{{inputs.language}}"
      formats: [md, docx, html]
      filename: literature-synthesis

connections:
  - {from: extract_1.text, to: synthesis}
  - {from: extract_2.text, to: synthesis}
  - {from: extract_3.text, to: synthesis}
  - {from: extract_1.text, to: check}
  - {from: extract_2.text, to: check}
  - {from: extract_3.text, to: check}
  - {from: synthesis.text, to: check}
  - {from: synthesis.text, to: report}
  - {from: check.text, to: report}
  - {from: report.text, to: export}

outputs:
  - {id: report_md, from: export.md, label: {tr: Rapor (Markdown), en: Report (Markdown)}}
  - {id: report_docx, from: export.docx, label: {tr: Rapor (Word), en: Report (Word)}}
  - {id: report_html, from: export.html, label: {tr: Rapor (HTML), en: Report (HTML)}}
