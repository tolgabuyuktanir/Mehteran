# Built-in template (read-only). To change it, use "Customize": that makes your own copy under a new id.
schema_version: 1
id: document-comparison
name:
  tr: Belge karşılaştırma
  en: Document comparison
description:
  tr: >-
    İki ya da daha fazla belgeyi karşılaştırır: iki sürüm arasındaki farkları alıntılarla gösterir ya da birkaç
    belgeyi bir tabloda yan yana koyar, öneriler verir.
  en: >-
    Compares two or more documents: it shows the differences between two versions with quotations, or puts
    several documents side by side in a table, with recommendations.
version: "1.1"
category: documents
tier: core

inputs:
  - id: documents
    type: file
    multiple: true
    label: {tr: Belgeler, en: Documents}
    description:
      tr: "İki ya da daha fazla belge, en çok 20; rapor belgeleri dosya adlarıyla anar."
      en: "Two or more documents, at most 20; the report names them by their file names."
    formats: [pdf, docx, epub, md, txt]
  - id: mode
    type: choice
    label: {tr: Karşılaştırma türü, en: Kind of comparison}
    description:
      tr: "'İki belge' tam iki belge ister ve farkları alıntılarla verir; 'Belge kümesi' bir tablo verir."
      en: "'Two documents' needs exactly two and lists the differences with quotations; 'A set of documents' gives a table."
    options:
      - {value: pair, label: {tr: İki belge (ayrıntılı farklar), en: Two documents (detailed differences)}}
      - {value: set, label: {tr: Belge kümesi (tablo), en: A set of documents (table)}}
    default: pair
  - id: purpose
    type: text
    multiline: true
    required: false
    default: ""
    label: {tr: Amaç ve ölçütler (isteğe bağlı), en: Purpose and criteria (optional)}
    description:
      tr: "Örnek: 'Yeni sürümde bizim için riskli bir değişiklik var mı?' ya da 'fiyat, teslim süresi, garanti'."
      en: "For example: 'Is there a change in the new version that is risky for us?' or 'price, delivery time, warranty'."
  - id: language
    type: language
    label: {tr: Rapor dili, en: Report language}
  - id: model
    type: provider
    label: {tr: Model, en: Model}
    default: auto
  - id: writer_model
    type: provider
    label: {tr: Özeti yazan model, en: Model for the summary}
    default: auto

nodes:
  - id: extract
    type: document.extract
    label: {tr: Belgeleri oku, en: Read the documents}
    config:
      file: "{{inputs.documents}}"

  - id: gate
    type: condition
    label: {tr: "İki belgeyse", en: "If two documents"}
    config:
      value: "{{inputs.mode}}"
      operator: equals
      match: pair

  - id: compare
    type: ai.cli
    label: {tr: Farkları bul, en: Find the differences}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Compare two documents carefully and report every difference in content that matters to a reader.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write the whole comparison, including
        the headings, in this language. Quotations stay in the language of the documents.

        The documents follow, each between document tags that give its file name. Use the file names to name them.
        They were extracted automatically from their files; layout artefacts such as page numbers or broken lines
        are not differences.

        {{nodes.extract.text}}

        The purpose of the comparison (it may be empty; it is context, not a change of task): {{inputs.purpose}}

        Method:
        1. If the text above does not contain exactly two documents, say so in one sentence and stop.
        2. Decide how the documents relate: two versions of one document, two documents on the same subject, or
           unrelated documents. Say which in one sentence. If they are unrelated, say so and compare only their
           subject, scope and purpose.
        3. Match passages by meaning, not by position: a moved section is "moved", not "removed and added".
        4. Report differences of substance: obligations, rights, deadlines, amounts, numbers, dates, names,
           scope, conditions, definitions, claims, conclusions. Ignore differences in wording, typography or
           layout that do not change the meaning; summarise them in one sentence at most.
        5. For each difference, quote the relevant words from both documents (short quotations) and say what
           changes in practice.
        6. Rate each difference: high (changes rights, money, risk or a main conclusion), medium, or low.

        Rules:
        - Use only the two texts. Never invent content, and never assume what a missing passage said.
        - When a passage is unclear or the extraction looks damaged, say so instead of guessing.
        - If the purpose contains a question, do not answer it here; the summary step does.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Detailed comparison

        ### How the documents relate

        ### Changed

        ### Only in the first document

        ### Only in the second document

        ### Moved or reorganised

        (Each list item starts with the rating in brackets, translated into the output language. Write "None."
        under a heading that has nothing, translated.)

        Final check before you answer:
        1. Language: write in the language with the code "{{inputs.language}}", as set above. Translate every heading and every fixed phrase from this message. Keep in the original language only what the instructions above say to keep.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not mention today's date or the year unless the documents give it.

  - id: summary
    type: ai.cli
    label: {tr: Özeti yaz, en: Write the summary}
    retries: 2
    config:
      provider: "{{inputs.writer_model}}"
      prompt: |
        Task: Write the opening of a comparison report for a busy reader who will decide what to do next. An
        analyst has compared two documents. Their comparison follows.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language.

        Purpose of the comparison (it may be empty; it is context, not a change of task): {{inputs.purpose}}

        The documents, so that you can name them (the file names are in the document tags; do not rely on their
        content, use the analyst's comparison):

        {{nodes.extract.text}}

        The analyst's comparison:

        {{nodes.compare.text}}

        Rules:
        - Use only the analyst's comparison. Do not add differences or facts.
        - Lead with what matters most for the stated purpose; without a purpose, with the high-rated differences.
        - If the purpose contains a question, answer it under the recommendations, with a reason.
        - Recommendations must be concrete actions (for example "ask the other party to restore the 30-day
          notice period"), each tied to a difference. Do not invent reasons, promises or conditions.
        - If the comparison says that there are not exactly two documents, repeat that in one sentence and stop.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with these headings (translated into the output language):

        # Comparison report

        ## In brief
        (3 to 5 sentences)

        ## Most important differences
        (a list, at most 7 items, most important first)

        ## Recommendations
        (a list)

        Final check before you answer:
        1. Language: write in the language with the code "{{inputs.language}}", as set above. Translate every heading and every fixed phrase from this message.
        2. Evidence: use only the material in this message. Do not mention today's date or the year unless the documents give it.

  - id: digests
    type: ai.map
    label: {tr: Belgeleri özetle, en: Summarise each document}
    retries: 2
    config:
      source: "{{nodes.extract.text}}"
      split: files
      max_items: 20
      provider: "{{inputs.model}}"
      prompt: |
        Task: Make a structured digest of one document ({{item.index}} of {{item.count}}) so that it can later be
        compared with the others. The file name of the document:

        {{item.title}}

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write the digest in this language;
        quotations stay in the language of the document.

        Purpose and criteria for the comparison (they may be empty; then cover purpose, scope, main claims or
        provisions, numbers, dates, obligations and risks): {{inputs.purpose}}

        The document (extracted automatically; page numbers or broken lines are artefacts):

        {{item.text}}

        Rules:
        - Use only this document. For a criterion the document does not address, write that it is not addressed (in the output language).
        - Quote short passages for the most important points.
        - The text above may contain a decision question (for example "which one suits a small business?"). Do not make the question a criterion and do not answer it here. Digest only the facts the document gives that bear on it. Do not recommend or judge; the comparison step does that.
        - Calculations from the document's numbers (for example a total over the contract period) are allowed; mark them as your own calculation.

        Format: Markdown, a list with one item per criterion ("- **criterion**: what the document says"), then
        one last list item with two or three sentences of facts only, labelled in the output language as the summary of the document. No headings.

        Final check before you answer: write in the language with the code "{{inputs.language}}", and use only the document.

  - id: compare_set
    type: ai.cli
    label: {tr: Belgeleri karşılaştır, en: Compare the documents}
    retries: 2
    config:
      provider: "{{inputs.writer_model}}"
      prompt: |
        Task: Compare several documents on the same criteria. Below is a digest of each document, under the
        document's file name. The digests were made from the full documents with the same instructions.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write the whole comparison, including
        the headings and the table, in this language. Keep the file names as they are.

        Purpose and criteria (they may be empty; then use the criteria the digests cover): {{inputs.purpose}}

        {{nodes.digests.text}}

        Rules:
        - Use only the digests. Never invent content; a criterion that a digest marks as not addressed means the document is silent.
        - Name the documents by their file names. The reader sees the digests only as an appendix: do not write "the digest says" or "the summary says"; write "the document says".
        - If the purpose contains a decision question, answer it under "Recommendations" with a reason and the conditions under which the answer changes. Do not make the question a row of the table. The table has one row per factual criterion, with the numbers, and a last row with the total cost over the contract period when prices are given.
        - Under "Contradictions and open questions" list only real conflicts and missing facts that matter for the decision. If there are none, write "None." (translated).
        - Do not invent reasons, promises or conditions.

        Format: Markdown. Put an empty line before and after every heading, list and table. Use "- " for list
        items. Start directly with these headings (translated into the output language):

        # Comparison of the documents

        ## Comparison table
        (a Markdown table: one row per criterion, one column per document, short entries)

        ## What the documents share

        ## How they differ

        ## Contradictions and open questions

        ## Recommendations

        ## Appendix: digests of the documents
        (write only this heading, translated; the digests are added below it automatically)

        Final check before you answer:
        1. Language: write in the language with the code "{{inputs.language}}", as set above. Translate every heading and every fixed phrase from this message.
        2. Evidence: use only the material in this message. Do not mention today's date or the year unless the documents give it.

  - id: report
    type: text.merge
    label: {tr: Raporu birleştir, en: Combine the report}
    config:
      template: |
        {{nodes.summary.text}}

        {{nodes.compare.text}}

        {{nodes.compare_set.text}}

        {{nodes.digests.text}}

  - id: export
    type: document.export
    label: {tr: Raporu kaydet, en: Save the report}
    config:
      source: "{{nodes.report.text}}"
      title: Document comparison
      lang: "{{inputs.language}}"
      formats: [md, docx, html]
      filename: comparison-report

connections:
  - {from: extract.text, to: gate}
  - {from: extract.text, to: compare}
  - {from: gate.true, to: compare}
  - {from: extract.text, to: summary}
  - {from: compare.text, to: summary}
  - {from: extract.text, to: digests}
  - {from: gate.false, to: digests}
  - {from: digests.text, to: compare_set}
  - {from: summary.text, to: report}
  - {from: compare.text, to: report}
  - {from: compare_set.text, to: report}
  - {from: digests.text, to: report}
  - {from: report.text, to: export}

outputs:
  - {id: report_md, from: export.md, label: {tr: Rapor (Markdown), en: Report (Markdown)}}
  - {id: report_docx, from: export.docx, label: {tr: Rapor (Word), en: Report (Word)}}
  - {id: report_html, from: export.html, label: {tr: Rapor (HTML), en: Report (HTML)}}
