schema_version: 1
id: topic-video-series
version: "2.1"
category: education
tier: experimental
name: {tr: "Sosyal medya video serisi", en: "Social video series"}
description:
  tr: "Konu başına bir video. Claude Opus senaryoyu yazar, GPT Image 2.6 Sunburst sahneleri çizer ve Eleven v4 seslendirir. OpenAI ve ElevenLabs API anahtarları, FFmpeg ve Pango gerekir. Görsel ve ses istekleri ücretli olabilir."
  en: "One video per topic. Claude Opus writes the script, GPT Image 2.6 Sunburst creates the scenes, and Eleven v4 narrates. Requires OpenAI and ElevenLabs API keys, FFmpeg, and Pango. Image and voice requests may incur charges."
inputs:
  - id: topics
    type: text
    multiline: true
    label: {tr: "Konular (satır başına bir konu, en fazla 8)", en: "Topics (one per line, up to 8)"}
  - id: platform
    type: choice
    label: {tr: "Yayın platformu", en: "Publishing platform"}
    default: instagram
    options:
      - {value: instagram, label: {tr: Instagram, en: Instagram}}
      - {value: youtube, label: {tr: YouTube, en: YouTube}}
      - {value: tiktok, label: {tr: TikTok, en: TikTok}}
      - {value: whatsapp, label: {tr: WhatsApp, en: WhatsApp}}
  - id: mode
    type: choice
    label: {tr: "Video türü", en: "Video format"}
    default: short
    options:
      - {value: short, label: {tr: "Reels / Shorts / Durum · 20 saniye", en: "Reels / Shorts / Status · 20 seconds"}}
      - {value: standard, label: {tr: "Standart video · 40 saniye", en: "Standard video · 40 seconds"}}
  - id: language
    type: language
    label: {tr: "Seslendirme ve altyazı dili", en: "Narration and caption language"}
  - id: model
    type: provider
    default: claude/opus@high
    label: {tr: "Model", en: "Model"}
nodes:
  - id: check
    type: video.check
    label: {tr: "Konuları ve video araçlarını kontrol et", en: "Check topics and video tools"}
    config:
      premium: true
      topics: "{{inputs.topics}}"
      lang: "{{inputs.language}}"
  - id: script
    type: ai.cli
    label: {tr: "Konu konu senaryo yaz", en: "Write a script for each topic"}
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Write a short educational video script in {{inputs.language}} for each topic below, in order.
        Platform: {{inputs.platform}}. Format: {{inputs.mode}}. Apply the timing budget separately to each topic:
        short = 3 scenes, 25–35 spoken words in about 20 seconds; standard = 5 scenes, 50–65 spoken words in about 40 seconds.
        Use the topic as a heading. For each numbered scene give one spoken sentence and a separate visual brief.
        Open with a concrete observation or question. Use the next scenes to explain it and finish with a specific takeaway.
        Read each line aloud in your head. Keep lines similar in length and use words that sound natural when spoken.
        Show the subject doing something visible. Avoid invented statistics, quotations and claims of certainty.
        Topics:
        {{nodes.check.text}}
  - id: review
    type: approval
    label: {tr: "Senaryoları onayla", en: "Review the scripts"}
    config:
      show: "{{nodes.script.text}}"
      instructions: {tr: "Anlatımı ve sahneleri inceleyin. Görsel önerilerinizi yorumda belirtin. Onay, ücretli ses önizlemesini başlatır.", en: "Review the narration and scenes. Add image suggestions in the comment. Approval starts a paid voice preview."}
  - id: storyboard
    type: ai.cli
    label: {tr: "Sahne çizimlerini tasarla", en: "Design the scene illustrations"}
    config:
      provider: "{{inputs.model}}"
      output: json
      json_schema: |
        {"type":"array","minItems":1,"maxItems":8,"items":{"type":"array","minItems":1,"maxItems":8,"items":{
          "type":"object","required":["narration","visual"],"additionalProperties":false,"properties":{
          "narration":{"type":"string","minLength":1,"maxLength":180},"visual":{"type":"string","minLength":12,"maxLength":600}}}}}
      prompt: |
        Encode the approved script as JSON. Return an outer array, one inner array per topic in the original order.
        Original topic list: {{inputs.topics}}
        Return only the array. A single topic is [[{"narration":"A tree grows.","visual":"Close-up of a young olive tree in morning sunlight with a softly blurred orchard."}]].
        Use the script’s narration in {{inputs.language}}. Each scene has one short spoken sentence, up to 180 characters, without markup.
        Each visual is a detailed standalone English image brief. Specify subject, setting, composition and lighting.
        Carry recurring subjects, setting and palette across the topic. Vary shot size and angle to show the next idea.
        Reserve the lower quarter for subtitles. Before returning, check that each approved scene has exactly one entry.
        Compose for {{inputs.platform}}, format {{inputs.mode}}. Avoid text in images.
        Approved script: {{nodes.review.text}}
        Reviewer notes: {{nodes.review.comment}}
  - id: voice
    type: video.preview
    label: {tr: "İlk sahneyi seslendir", en: "Narrate the first scene"}
    config:
      premium: true
      source: "{{nodes.storyboard.text}}"
      lang: "{{inputs.language}}"
  - id: listen
    type: approval
    label: {tr: "Sesi dinle ve onayla", en: "Listen and approve"}
    config:
      show: "{{nodes.storyboard.text}}"
      instructions: {tr: "İlk cümleyi dinleyin. Kalan sesleri ve sahne görsellerini ücretli servislerle üretmek için onaylayın.", en: "Play the first sentence. Approve to generate the remaining narration and scene images with paid services."}
  - id: render
    type: video.series
    timeout: 10800
    label: {tr: "Videoları seslendir ve kaydet", en: "Narrate and render the videos"}
    config:
      premium: true
      source: "{{nodes.listen.text}}"
      topics: "{{inputs.topics}}"
      lang: "{{inputs.language}}"
      platform: "{{inputs.platform}}"
      mode: "{{inputs.mode}}"
connections:
  - {from: check.text, to: script}
  - {from: script.text, to: review}
  - {from: review.text, to: storyboard}
  - {from: review.comment, to: storyboard}
  - {from: storyboard.text, to: voice}
  - {from: voice.audio, to: listen}
  - {from: storyboard.text, to: listen}
  - {from: listen.text, to: render}
outputs:
  - {id: videos, from: render.zip, label: {tr: "MP4 video serisi (ZIP)", en: "MP4 video series (ZIP)"}}
