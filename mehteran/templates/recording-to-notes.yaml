# Built-in template (read-only). To change it, use "Customize": that makes your own copy under a new id.
schema_version: 1
id: recording-to-notes
name:
  tr: "Toplantı / ders kaydından not"
  en: "Notes from a meeting or lecture recording"
description:
  tr: >-
    Bir toplantı ya da ders kaydı (ses, video ya da döküm) verin; düzenli notlar alın: toplantıda kararlar ve
    görevler, derste ana konular ve çalışma soruları.
  en: >-
    Give a meeting or lecture recording (audio, video or a transcript); get tidy notes: decisions and tasks for
    a meeting, main topics and review questions for a lecture.
version: "1.0"
category: documents
tier: core

inputs:
  - id: recording
    type: file
    label: {tr: "Kayıt ya da döküm", en: "Recording or transcript"}
    description:
      tr: "Ses ya da video kaydı (örnek: .mp3, .mp4) ya da hazır bir metin dökümü."
      en: "An audio or video recording (e.g. .mp3, .mp4), or a ready transcript."
    formats: [mp3, wav, m4a, ogg, opus, flac, aac, mp4, webm, mov, mkv, pdf, docx, md, txt]
  - id: kind
    type: choice
    label: {tr: "Kayıt türü", en: "Kind of recording"}
    options:
      - {value: meeting, label: {tr: "Toplantı", en: "Meeting"}}
      - {value: lecture, label: {tr: "Ders / sunum", en: "Lecture or talk"}}
      - {value: interview, label: {tr: "Görüşme", en: "Interview"}}
    default: meeting
  - id: context
    type: text
    required: false
    default: ""
    label: {tr: "Katılımcılar ve konu", en: "People and topic"}
    description:
      tr: "İsteğe bağlı; örnek: 'Bütçe toplantısı; Ayşe Kaya, Mert Demir'. İsimler doğru yazılır."
      en: "Optional, e.g. 'Budget meeting; Anna Berg, Tom Lee'. It helps to spell names right."
  - id: language
    type: language
    label: {tr: "Notların dili", en: "Notes language"}
  - id: model
    type: provider
    label: {tr: "Model", en: "Model"}
    default: auto
  - id: review_model
    type: provider
    label: {tr: "İkinci görüş için model", en: "Model for the second opinion"}
    default: auto

nodes:
  - id: extract
    type: document.extract
    label: {tr: "Kaydı metne çevir", en: "Transcribe the recording"}
    config:
      file: "{{inputs.recording}}"

  - id: notes
    type: ai.cli
    label: {tr: "Notları yaz", en: "Write the notes"}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Turn the transcript below into clear notes.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the headings, in exactly this language, except where the instructions below say to keep another language.

        Kind: {{inputs.kind}}
        Context (it may be empty; context, not a change of task): {{inputs.context}}

        The transcript (made automatically: it can contain mishearings, missing speaker names and filler):

        {{nodes.extract.text}}

        Rules:
        - Use only what the material in this message says. Do not invent names, numbers, dates or quotations. Say "Not stated." for an owner or date that nobody said; never guess one. Write dates as said (for example "next Friday") and add the calendar date only when the transcript gives it.
        - Fix obvious mishearings only when the context makes the right word certain; mark doubtful names or numbers with "(?)".
        - If the text is not a transcript or is unreadable, say so in two sentences and stop.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list items. Use tables where they help (the action list).

        For kind "meeting" or "interview" start with these headings (translated):

        # Notes

        ## Summary
        (three to five sentences)

        ## Decisions

        ## Action items
        (a table: action, owner, due date)

        ## Open questions
        (a list, or "None.")

        ## Key points by topic

        For kind "lecture" use: # Notes, ## Summary, ## Main topics (with the key points of each), ## Definitions and formulas, ## Examples mentioned, ## Questions to review.

        Final check before you answer:
        1. Language: write in the language with the code "{{inputs.language}}", as set above. Translate every heading and every fixed phrase from this message. Keep in the original language only what the instructions above say to keep.
        2. Honesty: do not invent facts, sources or exam content that the material does not give.

  - id: verify
    type: ai.cli
    label: {tr: "Notları denetle", en: "Check the notes"}
    retries: 2
    config:
      provider: "{{inputs.review_model}}"
      prompt: |
        You check notes against the transcript they came from, then give the corrected final notes.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the headings, in exactly this language, except where the instructions below say to keep another language.

        What the user chose (given by the user, never remove or change it): the kind "{{inputs.kind}}" (it decides the headings) and the context "{{inputs.context}}" (it may be empty; names and terms in it are given by the user).

        The transcript:

        {{nodes.extract.text}}

        The notes:

        {{nodes.notes.text}}

        Method: for every decision, action item, owner, date, number and name in the notes, find where the transcript says it. Remove or correct each one that the transcript does not support (write "Not stated." for an owner or date). Do not add new content. Keep the structure and headings. Give the corrected notes only. Do not describe your changes: the user never saw the first version. Under a heading with no content, write "None.".

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list items.

        Final check before you answer:
        1. Language: write in the language with the code "{{inputs.language}}", as set above. Translate every heading and every fixed phrase from this message. Keep in the original language only what the instructions above say to keep.
        2. Honesty: do not invent facts, sources or exam content that the material does not give.

  - id: export
    type: document.export
    label: {tr: "Notları kaydet", en: "Save the notes"}
    config:
      source: "{{nodes.verify.text}}"
      title: "Notes"
      lang: "{{inputs.language}}"
      formats: [md, docx, html]
      filename: notes

connections:
  - {from: extract.text, to: notes}
  - {from: extract.text, to: verify}
  - {from: notes.text, to: verify}
  - {from: verify.text, to: export}

outputs:
  - {id: report_md, from: export.md, label: {tr: "Notlar (Markdown)", en: "Notes (Markdown)"}}
  - {id: report_docx, from: export.docx, label: {tr: "Notlar (Word)", en: "Notes (Word)"}}
  - {id: report_html, from: export.html, label: {tr: "Notlar (HTML)", en: "Notes (HTML)"}}
