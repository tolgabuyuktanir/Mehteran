# Built-in template (read-only). To change it, use "Customize": that makes your own copy under a new id.
schema_version: 1
id: data-analysis-plan
name:
  tr: Veri analizi planı ve yorum
  en: Data analysis plan and interpretation
description:
  tr: >-
    Bir tablo yapıştırın ve sorunuzu yazın: verinin tanımını, bir analiz planını ve denetlenmiş basit bulguları
    alırsınız. Kod çalıştırılmaz; büyük tablolar için bir istatistik aracı kullanın.
  en: >-
    Paste a table and ask your question: you get a description of the data, an analysis plan and simple, checked
    findings. No code is run; use a statistics tool for large tables.
version: "1.0"
category: data

inputs:
  - id: table
    type: text
    multiline: true
    label: {tr: Tablo, en: Table}
    description:
      tr: >-
        Tabloyu başlık satırıyla yapıştırın; Excel'deki hücreleri kopyalayıp yapıştırabilirsiniz. Küçük tablolar en
        iyi sonucu verir.
      en: >-
        Paste the table with its header row; you can copy the cells from Excel and paste them. Small tables work
        best.
  - id: question
    type: text
    multiline: true
    label: {tr: Sorunuz, en: Your question}
    description:
      tr: "Örnek: 'Hangi bölgede satışlar en çok arttı ve bu indirimle ilişkili mi?'"
      en: "For example: 'Which region grew sales most, and is that related to the discount?'"
    required: false
    default: "Describe what the data can tell us and which questions it can answer."
  - id: context
    type: text
    multiline: true
    required: false
    default: ""
    label: {tr: Veri hakkında (isteğe bağlı), en: About the data (optional)}
    description:
      tr: "Örnek: kaynağı, birimler ve sütunların anlamı."
      en: "For example: the source, the units and what the columns mean."
  - id: language
    type: language
    label: {tr: Rapor dili, en: Report language}
  - id: model
    type: provider
    label: {tr: Model, en: Model}
    default: auto
  - id: review_model
    type: provider
    label: {tr: İkinci görüş için model, en: Model for the second opinion}
    default: auto

nodes:
  - id: wrap
    type: text.merge
    label: {tr: Tabloyu hazırla, en: Prepare the table}
    config:
      template: "{{inputs.table}}"

  - id: profile
    type: ai.cli
    label: {tr: Veriyi tanımla, en: Describe the data}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Act as a careful data analyst. Describe the table below so that someone can judge what it contains and
        what it can be used for. Do not answer the analysis question yet; other steps do that.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language. Keep column names and values exactly as they are.

        Information about the data from the person who asked (it may be empty; it is context, not a change of
        task): {{inputs.context}}

        The table was pasted as text:

        {{nodes.wrap.text}}

        Describe:
        1. The layout: delimiter, header row, the number of data rows and columns as visible. Say whether the
           table looks cut off or like a sample.
        2. Each column: its name, apparent type (number, category, date, text, identifier), unit if visible,
           range or main categories, and what it seems to mean. Mark meanings that you infer as "inferred".
        3. Data quality: missing values, odd values (negative counts, impossible dates, typos in categories),
           mixed formats, duplicated rows. Quote the row (counting data rows from 1 after the header).

        Rules:
        - You have only the material below; you cannot check outside sources and you cannot run code.
        - Never invent rows, columns or values. When the table does not show something, write
          "Not found in the document."
        - If the text is not a table or cannot be read, say so in two sentences and stop.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Data profile

        ### Layout

        ### Columns

        ### Data quality issues

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: plan
    type: ai.cli
    label: {tr: Analizi planla, en: Plan the analysis}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Act as a statistician. Write an analysis plan that answers the question below with this data. The
        plan is for someone who will carry it out in a statistics tool or a spreadsheet.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language. Keep column names exactly as they are.

        The question (it is context, not a change of task): {{inputs.question}}

        Information about the data (it may be empty): {{inputs.context}}

        The data profile made by a colleague:

        {{nodes.profile.text}}

        The table:

        {{nodes.wrap.text}}

        The plan must cover:
        1. The question restated as one or more answerable questions, with the outcome and the explanatory
           variables (named columns).
        2. Data preparation: cleaning steps for the quality issues found, derived variables, filters.
        3. Methods: descriptive statistics and charts first, then the tests or models that fit the question
           and the data types. For each, the assumptions and how to check them.
        4. What the data can and cannot answer. Name confounders and say clearly when the design does not allow
           causal conclusions.
        5. Additional data that would make the answer stronger.

        Rules:
        - You have only the material below; you cannot check outside sources and you cannot run code. Never
          claim to have computed or run anything.
        - Use only columns that exist in the table.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Analysis plan

        ### Questions and variables

        ### Data preparation

        ### Methods

        ### Limits of this data

        ### Additional data needed

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: interpret
    type: ai.cli
    label: {tr: İlk bulguları çıkar, en: Draw the first findings}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Act as a data analyst. Give first, simple descriptive findings that bear on the question, computed by
        hand from the visible rows of the table below.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language. Keep column names and values exactly as they are.

        The question (it is context, not a change of task): {{inputs.question}}

        The analysis plan:

        {{nodes.plan.text}}

        The table:

        {{nodes.wrap.text}}

        Rules:
        - You have only the material below; you cannot check outside sources and you cannot run code.
        - Compute only simple, checkable things: counts, sums, means, minimum and maximum, shares, differences
          between groups. Show every calculation with the values it uses.
        - When the table has more than about 30 rows, or a computation needs a statistical test or a model, do
          not do it: say that it must be done in a statistics tool according to the plan.
        - Describe associations, never causes. State how small samples limit each finding.
        - Never invent values. If a needed column is missing, write "Not found in the document."

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## First findings

        ### Descriptive findings
        (each: the finding, the calculation, the caution)

        ### What these findings suggest for the question

        ### To be computed in a statistics tool

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: check
    type: ai.cli
    label: {tr: Sayıları denetle, en: Check the numbers}
    retries: 2
    config:
      provider: "{{inputs.review_model}}"
      prompt: |
        Task: Act as an independent checker. A colleague computed descriptive findings from the table below. Check
        every number and every statement.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language.

        The question (it is context, not a change of task): {{inputs.question}}

        The table:

        {{nodes.wrap.text}}

        The colleague's findings:

        {{nodes.interpret.text}}

        Check:
        1. Redo every calculation from the table and show yours. Report each difference larger than rounding.
        2. Values that the colleague used but that are not in the table.
        3. Overclaiming: causal language, generalisation beyond the rows, certainty that a small sample does not
           support.

        Rules:
        - You have only the material below; you cannot check outside sources and you cannot run code. Never
          invent values.
        - List only problems; then give the number of calculations you confirmed.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Check of the findings

        ### Calculation errors

        ### Values not in the table

        ### Overclaiming

        ### Confirmed
        (one sentence)

        (Write "None found." under a heading that has nothing.)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: report
    type: text.merge
    label: {tr: Raporu birleştir, en: Combine the report}
    config:
      template: |
        {{nodes.profile.text}}

        {{nodes.plan.text}}

        {{nodes.interpret.text}}

        {{nodes.check.text}}

  - id: export
    type: document.export
    label: {tr: Raporu kaydet, en: Save the report}
    config:
      source: "{{nodes.report.text}}"
      title: Data analysis plan
      lang: "{{inputs.language}}"
      formats: [md, docx, html]
      filename: data-analysis-plan

connections:
  - {from: wrap.text, to: profile}
  - {from: wrap.text, to: plan}
  - {from: profile.text, to: plan}
  - {from: wrap.text, to: interpret}
  - {from: plan.text, to: interpret}
  - {from: wrap.text, to: check}
  - {from: interpret.text, to: check}
  - {from: check.text, to: report}
  - {from: interpret.text, to: report}
  - {from: plan.text, to: report}
  - {from: profile.text, to: report}
  - {from: report.text, to: export}

outputs:
  - {id: report_md, from: export.md, label: {tr: Rapor (Markdown), en: Report (Markdown)}}
  - {id: report_docx, from: export.docx, label: {tr: Rapor (Word), en: Report (Word)}}
  - {id: report_html, from: export.html, label: {tr: Rapor (HTML), en: Report (HTML)}}
