# Built-in template (read-only). To change it, use "Customize": that makes your own copy under a new id.
schema_version: 1
id: spreadsheet-analysis
name:
  tr: Tablo (CSV / Excel) analizi
  en: Spreadsheet (CSV / Excel) analysis
description:
  tr: >-
    Bir CSV, TSV ya da Excel (.xlsx) dosyasını okur (her sayfa ayrı bir tablo olur) ve tabloyu sorunuza göre
    inceler: sütunların ne anlattığı, veri kalitesi sorunları (boş, tutarsız, aykırı değerler), öne çıkan
    örüntüler ve sorunuzun cevabı. İkinci bir model analizi denetler: tabloda gerçekten görülemeyen her iddiayı
    işaretler. Çok büyük tablolar kısaltılır ve rapor bunu söyler. Sonuç Markdown, Word ve HTML rapordur;
    rapordaki tablolar Word ve HTML'de gerçek tablo olur.
  en: >-
    Reads a CSV, TSV or Excel (.xlsx) file (each sheet becomes a table of its own) and examines it for your
    question: what the columns describe, data quality problems (blanks, inconsistencies, outliers), notable
    patterns, and the answer to your question. A second model checks the analysis and marks every claim that the
    table does not actually show. Very large tables are cut, and the report says so. The result is a Markdown, Word
    and HTML report; its tables are real tables in Word and HTML.
version: "1.0"
category: data
tier: core

inputs:
  - id: data
    type: file
    label: {tr: Tablo dosyası, en: Spreadsheet file}
    description:
      tr: "CSV, TSV ya da Excel (.xlsx). İlk satır sütun başlıkları olmalı."
      en: "CSV, TSV or Excel (.xlsx). The first row should hold the column headings."
    formats: [csv, tsv, xlsx]
  - id: question
    type: text
    multiline: true
    required: false
    default: ""
    label: {tr: Sorunuz, en: Your question}
    description:
      tr: "Örnek: 'Hangi bölgede satışlar düşüyor?' Boş bırakılırsa genel bir inceleme yapılır."
      en: "For example: 'In which region are sales falling?' Left empty, a general review is made."
  - id: language
    type: language
    label: {tr: Rapor dili, en: Report language}
  - id: model
    type: provider
    label: {tr: Model, en: Model}
    default: auto
  - id: review_model
    type: provider
    label: {tr: İkinci görüş için model, en: Model for the second opinion}
    default: auto

nodes:
  - id: extract
    type: document.extract
    label: {tr: Tabloyu oku, en: Read the table}
    config:
      file: "{{inputs.data}}"

  - id: analyse
    type: ai.cli
    label: {tr: Tablo analizi, en: Table analysis}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        Task: Act as a careful data analyst. Below is a spreadsheet, converted to Markdown tables (one per sheet, under
        the sheet's name). A note in square brackets says when rows or columns were cut because the file was large.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write the whole analysis, including the
        headings, in this language. Keep column names and values as they are in the table.

        The question of the person who asked (it may be empty; then make a general review): {{inputs.question}}

        {{nodes.extract.text}}

        Method:
        1. Describe each table: what one row stands for, what each important column means, the units, and the
           range of the values.
        2. Data quality: blank cells, duplicated rows, inconsistent spellings or units, impossible or extreme
           values. Name the rows or values.
        3. Answer the question (or, without one, report the main patterns). Compute only what you can compute
           exactly from the rows shown: counts, sums, averages, minimum and maximum. Show small results as a
           Markdown table. When the table was cut, say that the numbers cover only the rows shown.
        4. Say what the table cannot answer and which data would be needed.

        Rules:
        - Use only the table. Never invent rows, values or causes. Mark an interpretation as an interpretation.
        - When you are not sure that a calculation is exact, say "approximately" and why.

        Format: Markdown. Put an empty line before and after every heading, list and table. Use "- " for list
        items. Start directly with these headings (translated into the output language):

        ## What the table contains

        ## Data quality

        ## Findings

        ## Limits of this analysis

  - id: check
    type: ai.cli
    label: {tr: Analizi denetle, en: Check the analysis}
    retries: 2
    config:
      provider: "{{inputs.review_model}}"
      prompt: |
        Task: Check a data analysis against the table it is based on, then give the corrected final analysis. Fix or
        remove every statement or number that the table does not support, and add every important point the
        analysis missed.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language.

        The question of the person who asked (given by the user; keep the analysis aimed at it; it may be empty): {{inputs.question}}

        The table:

        {{nodes.extract.text}}

        The analysis:

        {{nodes.analyse.text}}

        Recompute numbers only from the rows shown. Keep the structure and the headings of the analysis. Output
        only the corrected analysis. Do not describe your changes: the reader never saw the first version.

        Format: Markdown. Put an empty line before and after every heading, list and table. Use "- " for list
        items. Start directly with these headings (translated into the output language):

        ## What the table contains

        ## Data quality

        ## Findings

        ## Limits of this analysis

  - id: report
    type: text.merge
    label: {tr: Raporu birleştir, en: Assemble report}
    config:
      template: |
        {{nodes.check.text}}

  - id: export
    type: document.export
    label: {tr: Raporu kaydet, en: Save report}
    config:
      source: "{{nodes.report.text}}"
      title: Spreadsheet analysis
      lang: "{{inputs.language}}"
      formats: [md, docx, html]
      filename: spreadsheet-analysis

connections:
  - {from: extract.text, to: analyse}
  - {from: extract.text, to: check}
  - {from: analyse.text, to: check}
  - {from: check.text, to: report}
  - {from: report.text, to: export}

outputs:
  - {id: report_md, from: export.md, label: {tr: Rapor (Markdown), en: Report (Markdown)}}
  - {id: report_docx, from: export.docx, label: {tr: Rapor (Word), en: Report (Word)}}
  - {id: report_html, from: export.html, label: {tr: Rapor (HTML), en: Report (HTML)}}
