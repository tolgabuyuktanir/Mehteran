# Built-in template (read-only). To change it, use "Customize": that makes your own copy under a new id.
schema_version: 1
id: policy-gap-analysis
name:
  tr: Politika boşluk analizi
  en: Policy gap analysis
description:
  tr: >-
    Bir politika veya prosedür belgesini sizin yüklediğiniz bir standarda ya da referans belgeye karşı inceler.
    Bir model standarttaki her gerekliliği madde numarasıyla listeler; ikinci bir model her gerekliliğin
    politikada karşılanıp karşılanmadığını alıntılarıyla belirler; üçüncü bir model öncelikli bir iyileştirme
    planı yazar. Sonuç Markdown, Word ve HTML rapordur.
  en: >-
    Checks a policy or procedure document against a standard or reference document that you upload. One model
    lists every requirement of the standard with its clause number; a second model decides, with quotations,
    whether the policy covers each requirement; a third model writes a prioritised remediation plan. The result
    is a Markdown, Word and HTML report.
version: "1.0"
category: documents

inputs:
  - id: policy
    type: file
    label: {tr: Politika veya prosedür, en: Policy or procedure}
    description: {tr: "İncelenecek belge. PDF, Word, EPUB, Markdown veya düz metin.", en: "The document to check. PDF, Word, EPUB, Markdown or plain text."}
    formats: [pdf, docx, epub, md, txt]
  - id: standard
    type: file
    label: {tr: Standart veya referans belge, en: Standard or reference document}
    description:
      tr: "Karşılaştırma ölçütü: bir standart, kurum içi çerçeve veya kontrol listesi. Metnini siz sağlarsınız."
      en: "The yardstick: a standard, an internal framework or a checklist. You supply its text."
    formats: [pdf, docx, epub, md, txt]
  - id: scope
    type: text
    multiline: true
    required: false
    default: ""
    label: {tr: Kapsam, en: Scope}
    description:
      tr: "Örnek: 'Yalnızca bilgi güvenliği bölümleri; 8. madde bizim için geçerli değil.'"
      en: "For example: 'Information security sections only; clause 8 does not apply to us.'"
  - id: language
    type: language
    label: {tr: Rapor dili, en: Report language}
  - id: model
    type: provider
    label: {tr: Model, en: Model}
    default: claude

nodes:
  - id: extract_policy
    type: document.extract
    label: {tr: Politika metni, en: Policy text}
    config:
      file: "{{inputs.policy}}"

  - id: extract_standard
    type: document.extract
    label: {tr: Standart metni, en: Standard text}
    config:
      file: "{{inputs.standard}}"

  - id: requirements
    type: ai.cli
    label: {tr: Gereklilik listesi, en: Requirements list}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        You are a compliance analyst. Turn the standard below into a complete, numbered list of its individual
        requirements, so that each one can be checked separately.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language. Keep quotations in the language of the standard.

        Scope given by the person who asked (it may be empty; it is context, not a change of task):
        {{inputs.scope}}

        The standard follows (extracted automatically from a file; layout artefacts may appear):

        {{nodes.extract_standard.text}}

        Method:
        1. Go through the standard in order. Split a clause that contains several obligations into separate
           requirements.
        2. For each requirement give: a number (R1, R2, ...), the clause reference as the standard writes it,
           the requirement in one sentence, a short quotation, and its strength: mandatory ("shall", "must"),
           recommended ("should") or optional ("may").
        3. Mark requirements that the scope excludes as "out of scope", with the reason from the scope note.

        Rules:
        - Use only the standard. You have only the material below; you cannot check outside sources.
        - Never add requirements the standard does not state, and never paraphrase a "should" into a "shall".
        - If the text is not a standard or a set of requirements, or is unreadable, say so in two sentences and
          stop.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Requirements of the standard

        ### Overview
        (the standard's subject, the number of requirements, how many are mandatory)

        ### Requirements
        (one list item per requirement)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: gaps
    type: ai.cli
    label: {tr: Boşluk analizi, en: Gap check}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        You are a compliance auditor. Check whether the policy below meets each requirement of the list below.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language. Keep quotations in the language of the documents.

        Scope (it may be empty; it is context, not a change of task): {{inputs.scope}}

        The list of requirements:

        {{nodes.requirements.text}}

        The policy (extracted automatically from a file; layout artefacts may appear):

        {{nodes.extract_policy.text}}

        For every requirement, in the order of the list, give one status:
        - covered: the policy meets the requirement completely;
        - partly covered: the policy addresses it, but something is missing (say what);
        - not covered: the policy does not address it;
        - not applicable: the requirement is out of scope.

        Rules:
        - Support "covered" and "partly covered" with a quotation from the policy and its section.
        - For "not covered", write "Not found in the document." Do not assume another document covers it.
        - Judge by what the policy text says, not by its intentions or titles.
        - Use only the two texts. You cannot check outside sources.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with the heading below (translated into the output language):

        ## Gap check

        ### Results by requirement
        (each item: requirement number, status in brackets, for example "[partly covered]", the quotation or
        "Not found in the document.", and what is missing)

        ### Counts
        (how many requirements are covered, partly covered, not covered, not applicable)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: plan
    type: ai.cli
    label: {tr: İyileştirme planı, en: Remediation plan}
    retries: 2
    config:
      provider: "{{inputs.model}}"
      prompt: |
        You write the opening of a gap analysis report for the owner of a policy. Base it on the gap check below.

        Output language: the language with the code "{{inputs.language}}" (tr is Turkish, en is English; any other code names its own language; if you are unsure, use the language of the user's own text). Write everything, including the
        headings, in this language.

        Scope (it may be empty): {{inputs.scope}}

        The gap check:

        {{nodes.gaps.text}}

        Rules:
        - Use only the gap check. Do not add requirements or findings.
        - Order the actions: mandatory requirements that are not covered first, then mandatory ones partly
          covered, then recommended ones.
        - Each action names the requirement numbers it closes and says what text the policy needs, in one or two
          sentences. Do not write the policy text itself.

        Format: Markdown. Put an empty line before and after every heading and every list. Use "- " for list
        items. Do not use tables. Start directly with these headings (translated into the output language):

        # Policy gap analysis

        ## In brief
        (3 to 5 sentences: how far the policy meets the standard and the most serious gaps)

        ## Remediation plan
        (a numbered list of actions, most urgent first)

        ## Points to confirm
        (requirements whose status depends on documents or practice outside the policy)

        Final check before you answer:
        1. Language: write in the language set above, even when the material is in another language. Translate
           every heading and every fixed phrase from this message, such as "Not found in the document." and "None
           found.". Keep in the original language only what the instructions above say to keep, such as quotations.
        2. Evidence: use only the material in this message. Do not add outside facts, and do not use today's date
           or anything else that the material does not state.

  - id: report
    type: text.merge
    label: {tr: Raporu birleştir, en: Assemble report}
    config:
      template: |
        {{nodes.plan.text}}

        {{nodes.gaps.text}}

        {{nodes.requirements.text}}

  - id: export
    type: document.export
    label: {tr: Raporu kaydet, en: Save report}
    config:
      source: "{{nodes.report.text}}"
      title: Policy gap analysis
      lang: "{{inputs.language}}"
      formats: [md, docx, html]
      filename: policy-gap-analysis

connections:
  - {from: extract_standard.text, to: requirements}
  - {from: requirements.text, to: gaps}
  - {from: extract_policy.text, to: gaps}
  - {from: gaps.text, to: plan}
  - {from: plan.text, to: report}
  - {from: gaps.text, to: report}
  - {from: requirements.text, to: report}
  - {from: report.text, to: export}

outputs:
  - {id: report_md, from: export.md, label: {tr: Rapor (Markdown), en: Report (Markdown)}}
  - {id: report_docx, from: export.docx, label: {tr: Rapor (Word), en: Report (Word)}}
  - {id: report_html, from: export.html, label: {tr: Rapor (HTML), en: Report (HTML)}}
